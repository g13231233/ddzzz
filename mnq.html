<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归墟领主 · 终极刷图模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c14 0%, #161625 100%);
            color: #e0e0e0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(26, 26, 40, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
            border: 1px solid #333355;
        }

        .title {
            text-align: center;
            font-size: 32px;
            color: #ffd000;
            margin-bottom: 10px;
            text-shadow: 0 0 12px #ffd000;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .info-item {
            background: #25253d;
            padding: 10px 20px;
            border-radius: 8px;
            color: #ffcc33;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .btn-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .fight-btn {
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #ffb700, #ffd000);
            color: #000;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 208, 0, 0.4);
        }

        .fight-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 208, 0, 0.7);
        }

        .fight-btn:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .clear-btn {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #ff3030;
            color: #fff;
            cursor: pointer;
            margin-left: 15px;
        }

        .panel {
            background: #222238;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #333355;
        }

        .panel h3 {
            color: #ffd000;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            background: #2a2a44;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 15px;
            white-space: nowrap;
        }

        /* 物品品质颜色 */
        .normal { color: #ddd; }
        .equip { color: #ff5555; }
        .skill { color: #ffdd00; text-shadow: 0 0 6px #ffdd00; }
        .legend {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 12px #00ffff;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #00ffff;
            box-shadow: 0 0 50px #00ffff;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            from{transform: scale(0.8); opacity: 0;}
            to{transform: scale(1); opacity: 1;}
        }

        .modal-title {
            font-size: 28px;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ffff;
        }

        .modal-item {
            font-size: 22px;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-btn {
            padding: 12px 30px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">归墟领主 · 终极刷图</div>
        <div class="subtitle">自动挑战 · 出彩色极品自动停止</div>

        <div class="info-bar">
            <div class="info-item">累计挑战：<span id="count">0</span> 次</div>
        </div>

        <div class="btn-box">
            <button id="fightBtn" class="fight-btn" onclick="startAutoFight()">开始自动挑战归墟领主</button>
            <button class="clear-btn" onclick="resetAll()">清空所有数据</button>
        </div>

        <div class="panel">
            <h3>🎁 本次掉落</h3>
            <div id="nowDrop" class="item-grid"></div>
        </div>

        <div class="panel">
            <h3>🎒 累计背包</h3>
            <div id="bag" class="item-grid"></div>
        </div>
    </div>

    <!-- 极品弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title">🎉 恭喜爆出极品！</div>
            <div class="modal-item" id="legendItem"></div>
            <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
    </div>

    <script>
        let fightCount = 0;
        let bag = {};
        let isAutoFighting = false;
        const fightBtn = document.getElementById("fightBtn");

        // 归墟领主掉落
        const dropList = [
            {name: "《太虚蚀纹诀》", count:1, rate:12},
            {name: "《镇魂归元经》", count:1, rate:12},
            {name: "灵石袋", min:10, max:30, rate:80},
            {name: "还虚宝石袋", min:1, max:2, rate:92},
            {name: "修行月卡", count:1, rate:0.4},
            {name: "易名符", count:1, rate:0.1},
            {name: "功法残页", min:10, max:30, rate:100},
            {name: "还虚丹", min:3, max:5, rate:100},
            {name: "灵墨", count:1, rate:6},
            {name: "虚蚀精核", min:6, max:10, rate:100},
            {name: "洗炼符", min:10, max:20, rate:25},
            {name: "解缚符", count:1, rate:1},
            {name: "太虚蚀珠", count:1, rate:36},
            {name: "太虚蚀印", count:1, rate:14},
            {name: "太虚蚀袍", count:1, rate:42},
            {name: "太虚蚀缚", count:1, rate:48},
            {name: "太虚蚀冠", count:1, rate:48},
            {name: "太虚蚀坠", count:1, rate:36},
            {name: "太虚蚀裳", count:1, rate:42},
            {name: "太虚裂杖", count:1, rate:14},
            {name: "镇魂玉环", count:1, rate:36},
            {name: "镇魂归元符", count:1, rate:14},
            {name: "镇魂战甲", count:1, rate:42},
            {name: "镇魂护臂", count:1, rate:48},
            {name: "镇魂盔", count:1, rate:48},
            {name: "镇魂符链", count:1, rate:36},
            {name: "镇魂战裤", count:1, rate:42},
            {name: "镇魂重锋", count:1, rate:14},
            {name: "高级招募令", count:1, rate:0.2},
            {name: "顿悟符", count:1, rate:0.2},
        ];

        // 彩色极品列表
        const legendItems = ["修行月卡","易名符","高级招募令","顿悟符"];

        // 获取物品样式
        function getItemClass(name){
            if(legendItems.includes(name)) return "legend";
            if(name.includes("诀")||name.includes("经")) return "skill";
            if(name.includes("太虚")||name.includes("镇魂")) return "equip";
            return "normal";
        }

        // 抽取一次掉落
        function getDrop(){
            let res = [];
            dropList.forEach(item => {
                if(Math.random()*100 < item.rate){
                    let num = item.min !== undefined ?
                        Math.floor(Math.random()*(item.max-item.min+1)) + item.min :
                        item.count;
                    res.push({name:item.name, num});
                }
            });
            return res;
        }

        // 自动刷图
        function startAutoFight(){
            if(isAutoFighting) return;
            isAutoFighting = true;
            fightBtn.disabled = true;
            fightBtn.innerText = "自动挑战中...";

            function loop(){
                if(!isAutoFighting) return;

                fightCount++;
                document.getElementById("count").innerText = fightCount;
                let drops = getDrop();

                // 显示本次掉落
                showNowDrop(drops);

                // 加入背包
                drops.forEach(i => bag[i.name] = (bag[i.name]||0) + i.num);
                showBag();

                // 检测是否出彩色极品
                let legend = drops.find(i => legendItems.includes(i.name));
                if(legend){
                    isAutoFighting = false;
                    fightBtn.disabled = false;
                    fightBtn.innerText = "开始自动挑战归墟领主";
                    showLegendModal(legend);
                    return;
                }

                setTimeout(loop, 80); // 自动刷图速度
            }
            loop();
        }

        // 显示本次掉落
        function showNowDrop(list){
            let dom = document.getElementById("nowDrop");
            dom.innerHTML = list.map(i =>
                `<span class="item ${getItemClass(i.name)}">${i.name} ×${i.num}</span>`
            ).join("");
        }

        // 显示背包
        function showBag(){
            let dom = document.getElementById("bag");
            let arr = [];
            for(let k in bag){
                arr.push(`<span class="item ${getItemClass(k)}">${k} ×${bag[k]}</span>`);
            }
            dom.innerHTML = arr.join("") || '<span class="item normal">背包为空</span>';
        }

        // 极品弹窗
        function showLegendModal(item){
            document.getElementById("legendItem").innerText = `${item.name} ×${item.num}`;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal(){
            document.getElementById("modal").style.display = "none";
        }

        // 重置
        function resetAll(){
            isAutoFighting = false;
            fightCount = 0;
            bag = {};
            document.getElementById("count").innerText = 0;
            document.getElementById("nowDrop").innerHTML = "";
            document.getElementById("bag").innerHTML = "";
            fightBtn.disabled = false;
            fightBtn.innerText = "开始自动挑战归墟领主";
        }
    </script>
</body>
</html>
