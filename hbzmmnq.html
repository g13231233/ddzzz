<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伙伴招募模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h3 {
            margin-bottom: 15px;
            color: #eee;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .recruit-info .probability {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .probability-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rarity-tag {
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: white;
        }
        .rarity-tian { background: #ff4d6d; }
        .rarity-di { background: #ffb703; color: #111; }
        .rarity-xuan { background: #c084fc; }
        .rarity-huang { background: #60a5fa; }
        .cooling-info {
            margin: 15px 0;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .recruit-action .input-group {
            margin: 15px 0;
        }
        .recruit-action input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            margin-top: 8px;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .toggle-switch {
            width: 50px;
            height: 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 21px;
            height: 21px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }
        .toggle-switch.active {
            background: #4ade80;
        }
        .toggle-switch.active::after {
            left: 27px;
        }
        #recruit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        #recruit-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .partner-card {
            grid-column: 1 / -1;
        }
        .partner-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .partner-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .partner-basic-info h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .tag-rarity { color: white; }
        .tag-element { color: white; }
        .tag-level { background: #60a5fa; color: white; }
        .tag-gongfa { background: #c084fc; color: white; }
        .tag-job { background: #22d3ee; color: white; }
        .partner-desc { margin: 10px 0; color: #aaa; }
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .attr-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
        }
        .attr-name { color: #aaa; font-size: 14px; margin-bottom: 5px; }
        .attr-value { font-size: 18px; font-weight: bold; }
        .attr-growth { color: #4ade80; font-size: 14px; margin-left: 5px; }
        .level-up-section {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #level-up-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #4ade80;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        #level-up-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .level-display { color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <div class="card recruit-info">
        <h3>招募说明</h3>
        <p>每次招募生成一名伙伴，输入可留空，高级招募令无视冷却。</p>
        <div class="cooling-info">
            <p style="font-size:20px; font-weight:bold;" id="cooling-text">招募令：10 个</p>
            <p style="color:#aaa;">每 60 秒自动获得 1 个招募令</p>
        </div>
        <div class="probability">
            <div class="probability-item"><span class="rarity-tag rarity-huang">黄品</span><span>40%</span></div>
            <div class="probability-item"><span class="rarity-tag rarity-xuan">玄品</span><span>30%</span></div>
            <div class="probability-item"><span class="rarity-tag rarity-di">地品</span><span>20%</span></div>
            <div class="probability-item"><span class="rarity-tag rarity-tian">天品</span><span>10%</span></div>
        </div>
        <p style="margin-top:10px; font-size:14px; color:#aaa;">18 次必出天品</p>
    </div>

    <div class="card recruit-action">
        <h3>招募操作</h3>
        <div class="input-group">
            <p>底模（可留空）</p>
            <input type="text" id="mod-input" placeholder="输入任意内容">
        </div>
        <div class="toggle-group">
            <div class="toggle-switch" id="advanced-toggle"></div>
            <span>使用高级招募令（无视冷却）</span>
        </div>
        <p>当前招募令：<span id="advanced-count">10</span></p>
        <button id="recruit-btn">开始招募</button>
    </div>

    <div class="card partner-card" id="partner-display" style="display:none;">
        <div class="partner-header">
            <div class="partner-avatar" id="partner-avatar">🧚</div>
            <div class="partner-basic-info">
                <h2 id="partner-name">伙伴名称</h2>
                <div class="tags" id="partner-tags"></div>
                <p class="partner-desc" id="partner-desc"></p>
            </div>
        </div>
        <div class="level-up-section">
            <button id="level-up-btn">一键满级（100级）</button>
            <span class="level-display">等级：<span id="current-level">1</span></span>
        </div>
        <h3>属性</h3>
        <div class="attributes-grid" id="attributes-grid"></div>
    </div>
</div>

<script>
const baseAttrs = {
    hp: { current:13155, growth:155, level:78 },
    mp: { current:954, growth:10, level:78 },
    atk: { current:686, growth:8, level:78 },
    matk: { current:4032, growth:24, level:78 },
    def: { current:925, growth:11, level:78 },
    mdef: { current:1093, growth:13, level:78 },
    hitRate: { current:116.7, growth:0.1, level:78, isPercent:true },
    dodgeRate: { current:14.7, growth:0.1, level:78, isPercent:true },
    blockRate: { current:24.4, growth:0.2, level:78, isPercent:true },
    critRate: { current:53.3, growth:0.4, level:78, isPercent:true },
    critDamage: { current:259, growth:1, level:78, isPercent:true },
    critDef: { current:31.1, growth:0.3, level:78, isPercent:true },
    reflectDef: { current:10.7, growth:0.1, level:78, isPercent:true },
    antiCrit: { current:32.1, growth:0.3, level:78, isPercent:true },
    damageBonus: { current:67.3, growth:0.4, level:78, isPercent:true },
    healBonus: { current:11.7, growth:0.1, level:78, isPercent:true },
    damageReduction: { current:12.7, growth:0.1, level:78, isPercent:true },
    lifesteal: { current:9.7, growth:0.1, level:78, isPercent:true },
    cooldownReduction: { current:24.4, growth:0.2, level:78, isPercent:true },
    speed: { current:24.29, growth:0.08, level:78 },
    controlResist: { current:39.1, growth:0.3, level:78, isPercent:true },
    goldResist: { current:21.4, growth:0.2, level:78, isPercent:true },
    woodResist: { current:21.4, growth:0.2, level:78, isPercent:true },
    waterResist: { current:59.8, growth:0.4, level:78, isPercent:true },
    fireResist: { current:31.1, growth:0.3, level:78, isPercent:true },
    earthResist: { current:22.4, growth:0.2, level:78, isPercent:true },
    hpRegen: { current:34.95, growth:0.35, level:78 },
    mpRegen: { current:49.1, growth:0.3, level:78 }
};

function calcInitial() {
    let res = {};
    for(let k in baseAttrs) {
        let a = baseAttrs[k];
        res[k] = a.current - a.growth * (a.level - 1);
    }
    return res;
}
const initial = calcInitial();

const rarities = [
    {name:'黄品',key:'huang',rate:40,gongfa:3,mult:1},
    {name:'玄品',key:'xuan',rate:30,gongfa:4,mult:1.3},
    {name:'地品',key:'di',rate:20,gongfa:5,mult:1.6},
    {name:'天品',key:'tian',rate:10,gongfa:6,mult:2}
];

const elements = [
    {name:'金',color:'#eab308',job:'金锋使'},
    {name:'木',color:'#22c55e',job:'木灵使'},
    {name:'水',color:'#3b82f6',job:'法潮使'},
    {name:'火',color:'#ef4444',job:'炎焰使'},
    {name:'土',color:'#a16207',job:'岩盾使'}
];

const names = ['凌瑶','墨影','赤月','苍岚','紫宸','灵汐','浩宇','凤曦','龙战','青月'];
const avatars = ['🧚','🗡️','⚔️','🛡️','🐉','🔥','🦊','👑','🌊','🍃'];

let game = {
    token:10,
    tokenEnabled:false,
    partner:null,
    pity:0
};

// 自动产招募令
setInterval(()=>{
    game.token++;
    updateUI();
},60000);

const $ = s=>document.querySelector(s);
const updateUI = ()=>{
    $('#advanced-count').textContent = game.token;
    $('#cooling-text').textContent = `招募令：${game.token} 个`;
};

$('#advanced-toggle').onclick = ()=>{
    game.tokenEnabled = !game.tokenEnabled;
    $('#advanced-toggle').classList.toggle('active',game.tokenEnabled);
};

$('#recruit-btn').onclick = recruit;
$('#level-up-btn').onclick = ()=>{
    if(game.partner) game.partner.level = 100;
    showPartner();
};

function recruit(){
    // 招募令开启 = 直接招募
    if(game.tokenEnabled){
        if(game.token<1){ alert('招募令不足'); return; }
        game.token--;
        updateUI();
    }
    game.pity++;
    let rare;
    if(game.pity>=18){
        rare = rarities[3];
        game.pity=0;
    }else{
        let r = Math.random()*100, sum=0;
        for(let x of rarities){
            sum+=x.rate;
            if(r<=sum){ rare=x; break; }
        }
    }
    let elem = elements[Math.random()*5|0];
    let attrs = {};
    for(let k in initial){
        let b = initial[k];
        let g = baseAttrs[k].growth;
        let p = baseAttrs[k].isPercent||false;
        let m = rare.mult * (0.9+Math.random()*0.2);
        attrs[k] = {
            init:Math.floor(b*m),
            grow:g*m,
            isPercent:p
        };
    }
    game.partner = {
        name: names[Math.random()*names.length|0],
        avatar: avatars[Math.random()*avatars.length|0],
        rare, elem, attrs,
        level:1,
        job:elem.job
    };
    $('#partner-display').style.display='block';
    showPartner();
    updateUI();
}

function showPartner(){
    let p = game.partner;
    $('#partner-avatar').textContent = p.avatar;
    $('#partner-name').textContent = p.name;
    $('#current-level').textContent = p.level;
    $('#partner-tags').innerHTML = `
        <span class="tag tag-level">${p.level}级</span>
        <span class="tag tag-rarity" style="background:${p.rare.key=='tian'?'#f44':p.rare.key=='di'?'#fa0':p.rare.key=='xuan'?'#c8f':'#6af'}">${p.rare.name}</span>
        <span class="tag tag-element" style="background:${p.elem.color}">${p.elem.name}</span>
        <span class="tag tag-job">${p.job}</span>
        <span class="tag tag-gongfa">功法${p.rare.gongfa}</span>
    `;
    $('#partner-desc').textContent = `${p.elem.name}属性${p.rare.name}伙伴，擅长${p.job}之力`;
    let list = $('#attributes-grid');
    list.innerHTML = '';
    const keys = {
        hp:'气血',mp:'灵气',atk:'物攻',matk:'法攻',def:'物防',mdef:'法防',
        hitRate:'命中',dodgeRate:'闪避',blockRate:'招架',critRate:'暴击',
        critDamage:'暴伤',critDef:'暴减',reflectDef:'反减',antiCrit:'抗暴',
        damageBonus:'增伤',healBonus:'治疗',damageReduction:'减伤',lifesteal:'吸血',
        cooldownReduction:'冷却',speed:'速度',controlResist:'控抗',
        goldResist:'金抗',woodResist:'木抗',waterResist:'水抗',
        fireResist:'火抗',earthResist:'土抗',hpRegen:'回血',mpRegen:'回灵'
    };
    for(let k in p.attrs){
        let a = p.attrs[k];
        let val = a.init + a.grow*(p.level-1);
        let valTxt = a.isPercent ? val.toFixed(1)+'%' : Math.floor(val);
        let growTxt = a.isPercent ? `+${a.grow.toFixed(1)}%` : `+${a.grow.toFixed(1)}`;
        let div = document.createElement('div');
        div.className='attr-item';
        div.innerHTML = `<div class="attr-name">${keys[k]}</div><div class="attr-value">${valTxt}<span class="attr-growth">${growTxt}</span></div>`;
        list.appendChild(div);
    }
}
updateUI();
</script>
</body>
</html>
