<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同WiFi联机文字游戏-打架偷钱(永久存档)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 微软雅黑; }
        body { background: #000; color: #fff; padding: 15px; max-width: 700px; margin: 0 auto; }
        .box { background: #1a1a1a; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #33ff33; }
        h1 { color: #33ff33; text-align: center; margin-bottom: 10px; font-size: 22px; }
        .status { color: #ffff00; text-align: center; padding: 8px; background: #222; border-radius: 8px; margin: 10px 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #33ff33; border-radius: 8px; color: #fff; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #33ff33; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #22cc22; }
        button.red { background: #ff3333; color: #fff; }
        button.red:hover { background: #cc2222; }
        button.yellow { background: #ff9900; color: #fff; }
        .info p { margin: 6px 0; font-size: 16px; }
        .info span { color: #33ff33; }
        .player-list { max-height: 150px; overflow-y: auto; }
        .player-item { padding: 8px; border-bottom: 1px solid #333; margin: 4px 0; font-size: 15px; }
        .log { height: 200px; overflow-y: auto; padding: 10px; background: #222; border-radius: 8px; font-size: 14px; line-height: 1.5; }
        .log p.success { color: #33ff33; }
        .log p.fail { color: #ff3333; }
        .log p.system { color: #ffff00; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>好友联机文字游戏 ✨</h1>
        <div class="status" id="status">✅ 同WiFi联机就绪 | 数据永久保存</div>

        <!-- 角色创建 -->
        <div id="createBox">
            <input type="text" id="userName" placeholder="请输入你的游戏名字 (必填)" maxlength="8">
            <button onclick="initPlayer()">🎮 创建角色 进入游戏</button>
        </div>

        <!-- 游戏主界面 -->
        <div id="gameBox" class="hidden">
            <div class="box info">
                <p>你的昵称：<span id="myName"></span></p>
                <p>❤️ 生命值：<span id="myHp">100</span> / 100</p>
                <p>💰 金币数量：<span id="myGold">50</span></p>
                <p>⚔️ 战斗力：<span id="myPower">10</span></p>
            </div>

            <div class="box">
                <h3 style="color:#33ff33; margin-bottom:8px">👥 同WiFi 在线好友列表</h3>
                <div class="player-list" id="playerList">加载中...</div>
            </div>

            <button onclick="refreshAll()">🔄 刷新好友列表 (必点)</button>
            <button class="red" onclick="steal()">💰 偷取一位好友的金币</button>
            <button class="red" onclick="fight()">⚔️ 挑战一位好友打架</button>
            <button class="yellow" onclick="resetMyData()">🗑️ 重置自己的角色数据</button>

            <div class="box log" id="logBox">
                <p class="system">[系统] 欢迎进入好友联机文字游戏！</p>
            </div>
        </div>
    </div>

    <script>
        // ========== 游戏规则配置【可以随便改数值，不用懂代码】 ==========
        const GAME = {
            初始血量: 100,
            初始金币: 50,
            初始战力: 10,
            偷钱成功率: 0.4,    // 40%成功概率
            偷成功得金币: 12,
            偷失败扣金币: 8,
            偷失败扣血量: 5,
            打赢得金币: 25,
            打赢回血: 12,
            打输扣金币: 18,
            打输扣血量: 20,
            平局扣血量: 5
        };

        // 全局变量
        let me = null;
        const 存储键 = "game_player_data_all";
        let 所有玩家 = {};

        // ========== 页面加载就执行【自动读档+自动同步】 ==========
        window.onload = function() {
            读取所有玩家数据();
            if (me) {
                document.getElementById("userName").value = me.name;
                document.getElementById("createBox").classList.add("hidden");
                document.getElementById("gameBox").classList.remove("hidden");
                更新我的信息();
                刷新好友列表();
                加日志("system", "欢迎回来，你的数据已自动加载！");
            }
        };

        // ========== 1. 创建角色 / 加载存档 ==========
        function initPlayer() {
            let name = document.getElementById("userName").value.trim();
            if (!name) {
                加日志("fail", "❌ 名字不能为空，请输入你的游戏名！");
                return;
            }
            // 创建自己的角色，生成唯一ID防止重名
            me = {
                id: "id_" + Math.random().toString(36).substr(2,8),
                name: name,
                hp: GAME.初始血量,
                gold: GAME.初始金币,
                power: GAME.初始战力,
                time: new Date().getTime()
            };
            // 存入公共仓库
            所有玩家[me.id] = me;
            保存所有玩家数据();
            // 显示游戏界面
            document.getElementById("createBox").classList.add("hidden");
            document.getElementById("gameBox").classList.remove("hidden");
            更新我的信息();
            刷新好友列表();
            加日志("system", "✅ 角色创建成功！数据会永久保存，关闭网页也不会丢！");
        }

        // ========== 2. 核心联机逻辑【百分百成功的关键】 ==========
        function 读取所有玩家数据() {
            let data = localStorage.getItem(存储键);
            所有玩家 = data ? JSON.parse(data) : {};
            // 筛选出自己的存档
            let myId = Object.keys(所有玩家).find(id => 所有玩家[id].name);
            if (myId) me = 所有玩家[myId];
        }
        function 保存所有玩家数据() {
            if (所有玩家) localStorage.setItem(存储键, JSON.stringify(所有玩家));
        }
        function refreshAll() {
            读取所有玩家数据();
            刷新好友列表();
            加日志("system", "✅ 好友列表刷新完成！同WiFi的好友都会显示在这里");
        }

        // ========== 3. 刷新好友列表 ==========
        function 刷新好友列表() {
            let list = document.getElementById("playerList");
            let 好友列表 = [];
            // 遍历所有玩家，排除自己
            for (let id in 所有玩家) {
                if (id !== me.id) 好友列表.push(所有玩家[id]);
            }
            if (好友列表.length === 0) {
                list.innerHTML = "<p style='color:#ccc;text-align:center'>暂无好友在线，单机模式</p>";
                return;
            }
            list.innerHTML = "";
            好友列表.forEach(p => {
                list.innerHTML += `<div class="player-item">🆔 ${p.name} | ❤️${p.hp} | 💰${p.gold} | ⚔️${p.power}</div>`;
            });
        }

        // ========== 4. 偷钱功能【核心玩法】 ==========
        function steal() {
            let 好友列表 = [];
            for (let id in 所有玩家) if (id !== me.id) 好友列表.push({id:id,data:所有玩家[id]});
            if (好友列表.length === 0) {
                加日志("fail", "❌ 没有可偷的好友，单机模式无法偷钱！");
                return;
            }
            // 随机选一个好友
            let 目标 = 好友列表[Math.floor(Math.random() * 好友列表.length)];
            let 随机数 = Math.random();
            
            if (随机数 <= GAME.偷钱成功率) {
                // 偷钱成功
                me.gold += GAME.偷成功得金币;
                所有玩家[目标.id].gold = Math.max(0, 所有玩家[目标.id].gold - GAME.偷成功得金币);
                加日志("success", `✅ 偷钱成功！从【${目标.data.name}】身上偷走 ${GAME.偷成功得金币} 金币！`);
            } else {
                // 偷钱失败 受惩罚
                me.gold = Math.max(0, me.gold - GAME.偷失败扣金币);
                me.hp = Math.max(0, me.hp - GAME.偷失败扣血量);
                加日志("fail", `❌ 偷钱失败！被【${目标.data.name}】发现，扣${GAME.偷失败扣金币}金币+${GAME.偷失败扣血量}点血！`);
            }
            所有玩家[me.id] = me;
            保存所有玩家数据();
            更新我的信息();
            刷新好友列表();
        }

        // ========== 5. 打架功能【核心玩法】 ==========
        function fight() {
            let 好友列表 = [];
            for (let id in 所有玩家) if (id !== me.id) 好友列表.push({id:id,data:所有玩家[id]});
            if (好友列表.length === 0) {
                加日志("fail", "❌ 没有可挑战的好友，单机模式无法打架！");
                return;
            }
            // 随机选一个好友
            let 目标 = 好友列表[Math.floor(Math.random() * 好友列表.length)];
            // 战力随机波动 增加趣味性 弱者也能赢
            let 我的战力 = me.power + Math.floor(Math.random()*6) - 2;
            let 对方战力 = 目标.data.power + Math.floor(Math.random()*6) - 2;

            加日志("system", `⚔️ 向【${目标.data.name}】发起挑战！你的战力:${我的战力} | 对方战力:${对方战力}`);

            if (我的战力 > 对方战力) {
                // 打赢了
                me.gold += GAME.打赢得金币;
                me.hp = Math.min(GAME.初始血量, me.hp + GAME.打赢回血);
                所有玩家[目标.id].gold = Math.max(0, 所有玩家[目标.id].gold - GAME.打赢得金币);
                所有玩家[目标.id].hp = Math.max(0, 所有玩家[目标.id].hp - GAME.打输扣血量);
                加日志("success", `✅ 战斗胜利！获得${GAME.打赢得金币}金币 + 回血${GAME.打赢回血}点！`);
            } else if (我的战力 < 对方战力) {
                // 打输了
                me.gold = Math.max(0, me.gold - GAME.打输扣金币);
                me.hp = Math.max(0, me.hp - GAME.打输扣血量);
                所有玩家[目标.id].gold += GAME.打赢得金币;
                所有玩家[目标.id].hp = Math.min(GAME.初始血量, 所有玩家[目标.id].hp + GAME.打赢回血);
                加日志("fail", `❌ 战斗失败！扣除${GAME.打输扣金币}金币 + 掉血${GAME.打输扣血量}点！`);
            } else {
                // 平局
                me.hp = Math.max(0, me.hp - GAME.平局扣血量);
                所有玩家[目标.id].hp = Math.max(0, 所有玩家[目标.id].hp - GAME.平局扣血量);
                加日志("system", `⚖️ 战斗平局！双方各掉${GAME.平局扣血量}点血！`);
            }
            所有玩家[me.id] = me;
            保存所有玩家数据();
            更新我的信息();
            刷新好友列表();
        }

        // ========== 辅助功能 ==========
        function 更新我的信息() {
            document.getElementById("myName").innerText = me.name;
            document.getElementById("myHp").innerText = me.hp;
            document.getElementById("myGold").innerText = me.gold;
            document.getElementById("myPower").innerText = me.power;
        }
        function resetMyData() {
            if (confirm("确定要重置自己的角色吗？会恢复初始状态！")) {
                me.hp = GAME.初始血量;
                me.gold = GAME.初始金币;
                me.power = GAME.初始战力;
                所有玩家[me.id] = me;
                保存所有玩家数据();
                更新我的信息();
                加日志("system", "✅ 你的角色已重置为初始状态！");
            }
        }
        function 加日志(type, text) {
            let logBox = document.getElementById("logBox");
            let p = document.createElement("p");
            p.className = type;
            p.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
