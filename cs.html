<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零配置联机文字游戏 - 打架偷钱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #222; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        .container { background: #333; border-radius: 12px; padding: 25px; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        h1 { color: #0f0; text-align: center; margin-bottom: 20px; font-size: 24px; }
        .status { background: #444; padding: 10px; border-radius: 8px; margin: 15px 0; text-align: center; color: #ffd700; }
        .role-info { background: #444; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #0f0; }
        .role-info p { margin: 5px 0; font-size: 16px; }
        .online-list { background: #444; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .online-list h3 { color: #0f0; margin-bottom: 10px; font-size: 18px; }
        .player-card { background: #555; padding: 10px; border-radius: 6px; margin: 8px 0; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #0f0; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0cc; }
        button.danger { background: #f44; }
        button.danger:hover { background: #f66; }
        .log-box { background: #444; padding: 15px; border-radius: 8px; margin-top: 20px; height: 200px; overflow-y: auto; font-size: 14px; }
        .log-success { color: #0f0; }
        .log-fail { color: #f44; }
        .log-system { color: #ffd700; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>局域网联机文字游戏</h1>
        <div class="status" id="status">🔍 检测局域网中...</div>

        <!-- 角色创建 -->
        <div id="role-create">
            <button onclick="createRole()">🎮 创建游戏角色</button>
        </div>

        <!-- 游戏主界面 -->
        <div id="game-main" class="hidden">
            <div class="role-info">
                <p>🆔 角色名: <span id="role-name"></span></p>
                <p>❤️ 生命值: <span id="role-hp">100</span>/100</p>
                <p>💰 金币: <span id="role-gold">50</span></p>
                <p>⚔️ 战斗力: <span id="role-power">10</span></p>
            </div>

            <div class="online-list">
                <h3>👥 在线玩家 (同一WiFi)</h3>
                <div id="player-list">暂无在线玩家</div>
            </div>

            <button onclick="refreshPlayers()">🔄 刷新在线玩家</button>
            <button class="danger" onclick="stealGold()">💰 随机偷取金币</button>
            <button class="danger" onclick="fightPlayer()">⚔️ 随机挑战玩家</button>

            <div class="log-box" id="log-box">
                <p class="log-system">[系统] 游戏开始</p>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置 (可直接改数值)
        const GAME_CONFIG = {
            initHp: 100,
            initGold: 50,
            initPower: 10,
            stealSuccessRate: 0.4, // 偷钱成功率
            stealGain: 10,         // 偷成功得金币
            stealLose: 8,          // 偷失败扣金币
            stealHpLoss: 5,        // 偷失败扣血
            fightWinGold: 20,      // 打赢得金币
            fightWinHp: 10,        // 打赢回血
            fightLoseGold: 15,     // 打输扣金币
            fightLoseHp: 20,       // 打输扣血
            fightDrawHp: 5         // 平局扣血
        };

        // 全局变量
        let currentPlayer = null;
        let onlinePlayers = new Map(); // 存储在线玩家 {id: player}
        let broadcastChannel = null;

        // DOM元素
        const statusEl = document.getElementById('status');
        const roleCreateEl = document.getElementById('role-create');
        const gameMainEl = document.getElementById('game-main');
        const roleNameEl = document.getElementById('role-name');
        const roleHpEl = document.getElementById('role-hp');
        const roleGoldEl = document.getElementById('role-gold');
        const rolePowerEl = document.getElementById('role-power');
        const playerListEl = document.getElementById('player-list');
        const logBoxEl = document.getElementById('log-box');

        // ========== 初始化：零配置局域网通信 ==========
        window.onload = () => {
            // 创建广播通道 (核心：同一WiFi下自动通信，无需IP/端口)
            broadcastChannel = new BroadcastChannel('lan-text-game-final');
            
            // 监听其他玩家的消息
            broadcastChannel.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (!data || !data.id) return;
                    handlePlayerData(data);
                } catch (err) {}
            };

            // 标记为联机状态
            statusEl.textContent = "📶 已连接局域网 | 等待其他玩家";
            statusEl.style.color = "#0f0";
            addLog("系统", "局域网联机通道已开启，同一WiFi玩家会自动加入", "system");
        };

        // ========== 核心功能 ==========
        // 1. 创建角色
        function createRole() {
            // 生成随机角色名
            const randomId = Math.floor(Math.random() * 9999);
            currentPlayer = {
                id: `玩家_${randomId}`,
                hp: GAME_CONFIG.initHp,
                gold: GAME_CONFIG.initGold,
                power: GAME_CONFIG.initPower,
                timestamp: Date.now()
            };

            // 更新UI
            roleNameEl.textContent = currentPlayer.id;
            roleHpEl.textContent = currentPlayer.hp;
            roleGoldEl.textContent = currentPlayer.gold;
            rolePowerEl.textContent = currentPlayer.power;

            // 切换界面
            roleCreateEl.classList.add('hidden');
            gameMainEl.classList.remove('hidden');

            // 广播自己的信息
            broadcastPlayerData();
            addLog("系统", `角色创建成功：${currentPlayer.id}`, "system");
        }

        // 2. 刷新在线玩家列表
        function refreshPlayers() {
            if (onlinePlayers.size === 0) {
                playerListEl.innerHTML = "<p>暂无在线玩家 (单机模式)</p>";
                return;
            }

            let html = "";
            onlinePlayers.forEach(player => {
                html += `
                <div class="player-card">
                    🆔 ${player.id} | ❤️ ${player.hp} | 💰 ${player.gold} | ⚔️ ${player.power}
                </div>`;
            });
            playerListEl.innerHTML = html;
            addLog("系统", `当前在线玩家：${onlinePlayers.size} 人`, "system");
        }

        // 3. 偷钱功能
        function stealGold() {
            if (!currentPlayer) return;
            const players = Array.from(onlinePlayers.values());
            if (players.length === 0) {
                addLog("系统", "没有可偷的玩家，单机模式无法偷钱！", "fail");
                return;
            }

            // 随机选目标
            const target = players[Math.floor(Math.random() * players.length)];
            const random = Math.random();

            if (random <= GAME_CONFIG.stealSuccessRate) {
                // 偷成功
                currentPlayer.gold += GAME_CONFIG.stealGain;
                target.gold = Math.max(0, target.gold - GAME_CONFIG.stealGain);
                addLog("成功", `✅ 成功偷取【${target.id}】${GAME_CONFIG.stealGain}金币！`, "success");
            } else {
                // 偷失败
                currentPlayer.gold = Math.max(0, currentPlayer.gold - GAME_CONFIG.stealLose);
                currentPlayer.hp = Math.max(0, currentPlayer.hp - GAME_CONFIG.stealHpLoss);
                addLog("失败", `❌ 偷【${target.id}】被发现！扣${GAME_CONFIG.stealLose}金币+${GAME_CONFIG.stealHpLoss}血`, "fail");
            }

            updatePlayerUI();
            broadcastPlayerData();
            broadcastPlayerData(target); // 同步目标数据
        }

        // 4. 打架功能
        function fightPlayer() {
            if (!currentPlayer) return;
            const players = Array.from(onlinePlayers.values());
            if (players.length === 0) {
                addLog("系统", "没有可挑战的玩家，单机模式无法打架！", "fail");
                return;
            }

            // 随机选目标
            const target = players[Math.floor(Math.random() * players.length)];
            // 战力随机波动
            const myPower = currentPlayer.power + Math.floor(Math.random() * 6) - 2;
            const targetPower = target.power + Math.floor(Math.random() * 6) - 2;

            addLog("系统", `⚔️ 挑战【${target.id}】！你的战力：${myPower} | 对方战力：${targetPower}`, "system");

            if (myPower > targetPower) {
                // 赢
                currentPlayer.gold += GAME_CONFIG.fightWinGold;
                currentPlayer.hp = Math.min(GAME_CONFIG.initHp, currentPlayer.hp + GAME_CONFIG.fightWinHp);
                target.gold = Math.max(0, target.gold - GAME_CONFIG.fightWinGold);
                target.hp = Math.max(0, target.hp - GAME_CONFIG.fightLoseHp);
                addLog("成功", `✅ 打赢了！获得${GAME_CONFIG.fightWinGold}金币+${GAME_CONFIG.fightWinHp}血`, "success");
            } else if (myPower < targetPower) {
                // 输
                currentPlayer.gold = Math.max(0, currentPlayer.gold - GAME_CONFIG.fightLoseGold);
                currentPlayer.hp = Math.max(0, currentPlayer.hp - GAME_CONFIG.fightLoseHp);
                target.gold += GAME_CONFIG.fightWinGold;
                target.hp = Math.min(GAME_CONFIG.initHp, target.hp + GAME_CONFIG.fightWinHp);
                addLog("失败", `❌ 打输了！扣${GAME_CONFIG.fightLoseGold}金币+${GAME_CONFIG.fightLoseHp}血`, "fail");
            } else {
                // 平局
                currentPlayer.hp = Math.max(0, currentPlayer.hp - GAME_CONFIG.fightDrawHp);
                target.hp = Math.max(0, target.hp - GAME_CONFIG.fightDrawHp);
                addLog("系统", `⚖️ 平局！双方各扣${GAME_CONFIG.fightDrawHp}血`, "system");
            }

            updatePlayerUI();
            broadcastPlayerData();
            broadcastPlayerData(target);
        }

        // ========== 辅助函数 ==========
        // 广播玩家数据
        function broadcastPlayerData(player = currentPlayer) {
            if (!player || !broadcastChannel) return;
            try {
                broadcastChannel.postMessage(JSON.stringify(player));
            } catch (err) {}
        }

        // 处理其他玩家数据
        function handlePlayerData(player) {
            if (player.id === currentPlayer?.id) return; // 跳过自己
            onlinePlayers.set(player.id, player);
            refreshPlayers();
        }

        // 更新自己的UI
        function updatePlayerUI() {
            roleHpEl.textContent = currentPlayer.hp;
            roleGoldEl.textContent = currentPlayer.gold;
            rolePowerEl.textContent = currentPlayer.power;
        }

        // 添加日志
        function addLog(type, content, cls) {
            const time = new Date().toLocaleTimeString();
            const p = document.createElement('p');
            p.className = `log-${cls || type}`;
            p.innerHTML = `[${time}] ${content}`;
            logBoxEl.appendChild(p);
            logBoxEl.scrollTop = logBoxEl.scrollHeight;
        }
    </script>
</body>
</html>
