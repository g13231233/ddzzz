<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NetplayJS 多人游戏 - 好友对战</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 3px solid #00d9ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,217,255,0.3);
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #16213e;
            border-radius: 8px;
            font-family: monospace;
        }
        .instruction {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        button {
            background: #00d9ff;
            border: none;
            padding: 8px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00a8cc;
        }
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>🎮 NetplayJS 多人竞技场</h1>
    <p>红色方块是你，蓝色方块是对手 | 使用 WASD 或 方向键 移动</p>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="status">
            🔄 正在连接...
        </div>
        <div class="instruction">
            💡 提示：第一个打开页面的人是主机，把链接分享给朋友即可加入<br>
            🎯 目标：触碰对手即可得分！谁先拿到5分获胜
        </div>
    </div>

    <!-- 引入 NetplayJS -->
    <script src="https://unpkg.com/[email protected]/dist/netplay.js"></script>
    
    <script>
        // 定义我们的游戏类
        class CatchGame extends netplayjs.Game {
            constructor(canvas, players) {
                super();
                this.canvas = canvas;
                
                // 初始化玩家位置
                this.playerPositions = new Map();
                // 分数
                this.scores = new Map();
                // 游戏是否结束
                this.gameOver = false;
                this.winner = null;
                
                // 为每个玩家设置初始位置和分数
                players.forEach((player, index) => {
                    const id = player.getID();
                    if (index === 0) {
                        this.playerPositions.set(id, { x: 100, y: 250 });
                    } else {
                        this.playerPositions.set(id, { x: 700, y: 250 });
                    }
                    this.scores.set(id, 0);
                });
                
                // 记录自己的玩家ID
                this.myId = players.find(p => p.isLocal())?.getID();
            }
            
            // tick 函数：每帧执行，处理所有玩家的输入
            tick(playerInputs) {
                if (this.gameOver) return;
                
                // 获取所有玩家的位置副本，用于碰撞检测
                const positions = new Map(this.playerPositions);
                
                for (const [player, input] of playerInputs.entries()) {
                    const id = player.getID();
                    let pos = this.playerPositions.get(id);
                    if (!pos) continue;
                    
                    // 从输入中获取方向键状态
                    const vel = input.arrowKeys();
                    const speed = 6;
                    
                    // 更新位置
                    let newX = pos.x + vel.x * speed;
                    let newY = pos.y + vel.y * speed;
                    
                    // 边界限制
                    newX = Math.max(30, Math.min(770, newX));
                    newY = Math.max(30, Math.min(470, newY));
                    
                    this.playerPositions.set(id, { x: newX, y: newY });
                }
                
                // 碰撞检测：红方(第一个玩家)触碰蓝方(第二个玩家)
                const playersList = Array.from(playerInputs.keys());
                if (playersList.length >= 2) {
                    const p1Id = playersList[0].getID();
                    const p2Id = playersList[1].getID();
                    const p1Pos = this.playerPositions.get(p1Id);
                    const p2Pos = this.playerPositions.get(p2Id);
                    
                    if (p1Pos && p2Pos) {
                        const distance = Math.hypot(p1Pos.x - p2Pos.x, p1Pos.y - p2Pos.y);
                        if (distance < 40) {
                            // 触碰得分，被触碰者重置位置
                            const toucher = this.isPlayer1 ? p1Id : p2Id;
                            const victim = toucher === p1Id ? p2Id : p1Id;
                            
                            this.scores.set(toucher, this.scores.get(toucher) + 1);
                            
                            // 重置位置
                            this.playerPositions.set(p1Id, { x: 100, y: 250 });
                            this.playerPositions.set(p2Id, { x: 700, y: 250 });
                            
                            // 检查胜利
                            if (this.scores.get(toucher) >= 5) {
                                this.gameOver = true;
                                this.winner = toucher;
                            }
                        }
                    }
                }
            }
            
            // 绘制游戏画面
            draw(canvas) {
                const ctx = canvas.getContext("2d");
                
                // 背景
                ctx.fillStyle = "#0f0f23";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                ctx.strokeStyle = "#2a2a4a";
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.width; i += 50) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(canvas.width, i);
                    ctx.stroke();
                }
                
                // 绘制所有玩家
                for (const [id, pos] of this.playerPositions.entries()) {
                    // 区分颜色：自己是红色？需要判断一下
                    // 简单起见：ID最小的红色，另一个蓝色
                    const isRed = id === Math.min(...this.playerPositions.keys());
                    ctx.fillStyle = isRed ? "#ff4444" : "#4488ff";
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = isRed ? "#ff0000" : "#0088ff";
                    ctx.fillRect(pos.x - 20, pos.y - 20, 40, 40);
                    ctx.fillStyle = "white";
                    ctx.font = "bold 16px Arial";
                    ctx.fillText(isRed ? "P1" : "P2", pos.x - 8, pos.y + 6);
                }
                ctx.shadowBlur = 0;
                
                // 显示分数
                ctx.font = "bold 28px Arial";
                ctx.fillStyle = "#ff8888";
                const scoresList = Array.from(this.scores.entries());
                if (scoresList[0]) ctx.fillText(`${scoresList[0][1]}`, 60, 60);
                if (scoresList[1]) ctx.fillText(`${scoresList[1][1]}`, canvas.width - 100, 60);
                
                // 显示胜利信息
                if (this.gameOver && this.winner !== undefined) {
                    ctx.font = "bold 36px Arial";
                    ctx.fillStyle = "#ffcc00";
                    ctx.shadowBlur = 0;
                    const winnerText = this.winner === this.myId ? "🎉 你赢了！ 🎉" : "😢 对手赢了... 😢";
                    ctx.fillText(winnerText, canvas.width/2 - 120, canvas.height/2);
                }
            }
            
            // 序列化游戏状态（NetplayJS 需要）
            serialize() {
                const positionsObj = {};
                for (const [id, pos] of this.playerPositions.entries()) {
                    positionsObj[id] = pos;
                }
                const scoresObj = {};
                for (const [id, score] of this.scores.entries()) {
                    scoresObj[id] = score;
                }
                return {
                    playerPositions: positionsObj,
                    scores: scoresObj,
                    gameOver: this.gameOver,
                    winner: this.winner
                };
            }
            
            // 反序列化
            deserialize(value) {
                this.playerPositions.clear();
                for (const [id, pos] of Object.entries(value.playerPositions)) {
                    this.playerPositions.set(parseInt(id), pos);
                }
                this.scores.clear();
                for (const [id, score] of Object.entries(value.scores)) {
                    this.scores.set(parseInt(id), score);
                }
                this.gameOver = value.gameOver;
                this.winner = value.winner;
            }
        }
        
        // 配置游戏参数
        CatchGame.timestep = 1000 / 60;  // 60 FPS
        CatchGame.canvasSize = { width: 800, height: 500 };
        
        // 启动游戏（使用 Rollback 回滚网络代码）
        const canvas = document.getElementById("gameCanvas");
        const statusDiv = document.getElementById("status");
        
        // 监听连接状态
        const game = new netplayjs.RollbackWrapper(CatchGame);
        
        // 显示状态更新（可选，通过轮询）
        setInterval(() => {
            if (game.room) {
                const playerCount = game.room.getPlayers().length;
                statusDiv.innerHTML = `✅ 已连接 | 房间人数: ${playerCount}/2<br>🏆 先触碰对手5次获胜！`;
            }
        }, 1000);
        
        // 启动！
        game.start();
        
        statusDiv.innerHTML = "🎮 游戏已启动！<br>📤 分享这个页面链接给朋友，他们打开后会自动加入";
    </script>
</body>
</html>
