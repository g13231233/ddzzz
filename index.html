<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NetplayJS 多人游戏 - 稳定版</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            font-family: monospace;
        }
        button {
            background: #00d9ff;
            border: none;
            padding: 10px 25px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        input {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
            width: 200px;
        }
        .room-info {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>🎮 NetplayJS 好友对战</h1>
    
    <div id="lobby">
        <div class="room-info">
            <h3>🔗 连接设置</h3>
            <p>方案1: 点击"创建房间"，把房间码发给朋友</p>
            <p>方案2: 如果连不上，点"使用备用服务器"</p>
        </div>
        
        <button onclick="createRoom()">🏠 创建房间（主机）</button>
        <button onclick="showJoinUI()">🔌 加入房间</button>
        <button onclick="useBackupServer()">🔄 使用备用服务器</button>
        
        <div id="joinPanel" style="display:none; margin-top:20px">
            <input type="text" id="roomCode" placeholder="输入房间码">
            <button onclick="joinRoom()">加入</button>
        </div>
        
        <div id="status">
            💡 等待操作...
        </div>
    </div>
    
    <div id="gameArea" style="display:none">
        <canvas id="gameCanvas" width="800" height="500" style="border:3px solid #00d9ff; border-radius:10px"></canvas>
        <div id="gameStatus" class="room-info">
            🎮 游戏中 | 房间: <span id="currentRoom"></span>
        </div>
        <div class="instruction">
            🎯 红色=你，蓝色=对手 | 移动触碰对手得分！先得5分获胜<br>
            ⌨️ 控制: WASD 或 方向键
        </div>
    </div>

    <script src="https://unpkg.com/[email protected]/dist/netplay.js"></script>
    
    <script>
        let currentGame = null;
        let currentRoomId = null;
        
        // 配置ICE服务器（帮助建立连接）
        const iceServers = [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun.relay.metered.ca:80" }
        ];
        
        function showJoinUI() {
            document.getElementById('joinPanel').style.display = 'block';
        }
        
        function useBackupServer() {
            // 提示用户刷新页面时加参数
            alert("请在浏览器地址栏的 .html 后面加上：\n#server=wss://netplayjs-signal.herokuapp.com\n\n然后按回车刷新页面重试");
            
            // 或者直接尝试重新初始化
            location.reload();
        }
        
        async function createRoom() {
            document.getElementById('status').innerHTML = "🔄 正在创建房间，连接信令服务器...";
            
            try {
                // 尝试连接到信令服务器
                const game = new netplayjs.RollbackWrapper(CatchGame);
                
                // 监听连接状态
                game.onStateChange = (state) => {
                    console.log("Game state:", state);
                    if (state === "connected") {
                        document.getElementById('status').innerHTML = "✅ 已连接！等待朋友加入...";
                    }
                };
                
                await game.start();
                currentGame = game;
                
                // 获取房间信息
                setTimeout(() => {
                    if (game.room) {
                        currentRoomId = game.room.getRoomId();
                        document.getElementById('status').innerHTML = 
                            `✅ 房间创建成功！<br>📋 房间码: <strong style="font-size:20px">${currentRoomId}</strong><br>👥 当前人数: ${game.room.getPlayers().length}/2<br>📤 把房间码发给朋友，让他们点击"加入房间"`;
                        document.getElementById('lobby').style.display = 'none';
                        document.getElementById('gameArea').style.display = 'block';
                        document.getElementById('currentRoom').innerText = currentRoomId;
                    }
                }, 2000);
                
            } catch(e) {
                console.error(e);
                document.getElementById('status').innerHTML = 
                    "❌ 连接失败！<br>👉 试试点击「使用备用服务器」按钮，或刷新页面重试<br>错误: " + e.message;
            }
        }
        
        async function joinRoom() {
            const roomCode = document.getElementById('roomCode').value.trim();
            if (!roomCode) {
                alert("请输入房间码");
                return;
            }
            
            document.getElementById('status').innerHTML = `🔄 正在加入房间 ${roomCode}...`;
            
            try {
                const game = new netplayjs.RollbackWrapper(CatchGame);
                await game.start({ roomId: roomCode });
                currentGame = game;
                
                document.getElementById('status').innerHTML = "✅ 加入成功！游戏即将开始";
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('currentRoom').innerText = roomCode;
                
            } catch(e) {
                console.error(e);
                document.getElementById('status').innerHTML = 
                    "❌ 加入失败！<br>👉 检查房间码是否正确，或让主机重新创建房间<br>错误: " + e.message;
            }
        }
        
        // ========== 游戏逻辑 ==========
        class CatchGame extends netplayjs.Game {
            constructor(canvas, players) {
                super();
                this.canvas = canvas;
                
                this.playerPositions = new Map();
                this.scores = new Map();
                this.gameOver = false;
                this.winner = null;
                this.myId = null;
                
                players.forEach((player, index) => {
                    const id = player.getID();
                    if (player.isLocal()) this.myId = id;
                    if (index === 0) {
                        this.playerPositions.set(id, { x: 100, y: 250 });
                    } else {
                        this.playerPositions.set(id, { x: 700, y: 250 });
                    }
                    this.scores.set(id, 0);
                });
            }
            
            tick(playerInputs) {
                if (this.gameOver) return;
                
                for (const [player, input] of playerInputs.entries()) {
                    const id = player.getID();
                    let pos = this.playerPositions.get(id);
                    if (!pos) continue;
                    
                    const vel = input.arrowKeys();
                    const speed = 6;
                    
                    let newX = pos.x + vel.x * speed;
                    let newY = pos.y + vel.y * speed;
                    newX = Math.max(30, Math.min(770, newX));
                    newY = Math.max(30, Math.min(470, newY));
                    
                    this.playerPositions.set(id, { x: newX, y: newY });
                }
                
                const playersList = Array.from(playerInputs.keys());
                if (playersList.length >= 2) {
                    const p1Id = playersList[0].getID();
                    const p2Id = playersList[1].getID();
                    const p1Pos = this.playerPositions.get(p1Id);
                    const p2Pos = this.playerPositions.get(p2Id);
                    
                    if (p1Pos && p2Pos) {
                        const distance = Math.hypot(p1Pos.x - p2Pos.x, p1Pos.y - p2Pos.y);
                        if (distance < 40) {
                            const toucher = this.myId === p1Id ? p1Id : p2Id;
                            const victim = toucher === p1Id ? p2Id : p1Id;
                            
                            this.scores.set(toucher, this.scores.get(toucher) + 1);
                            this.playerPositions.set(p1Id, { x: 100, y: 250 });
                            this.playerPositions.set(p2Id, { x: 700, y: 250 });
                            
                            if (this.scores.get(toucher) >= 5) {
                                this.gameOver = true;
                                this.winner = toucher;
                            }
                        }
                    }
                }
            }
            
            draw(canvas) {
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "#0f0f23";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (const [id, pos] of this.playerPositions.entries()) {
                    const isMe = id === this.myId;
                    ctx.fillStyle = isMe ? "#ff4444" : "#4488ff";
                    ctx.fillRect(pos.x - 20, pos.y - 20, 40, 40);
                    ctx.fillStyle = "white";
                    ctx.font = "bold 16px Arial";
                    ctx.fillText(isMe ? "你" : "对手", pos.x - 8, pos.y + 6);
                }
                
                ctx.font = "bold 28px Arial";
                ctx.fillStyle = "#ff8888";
                const scoresList = Array.from(this.scores.entries());
                if (scoresList[0]) ctx.fillText(`${scoresList[0][1]}`, 60, 60);
                if (scoresList[1]) ctx.fillText(`${scoresList[1][1]}`, canvas.width - 100, 60);
                
                if (this.gameOver && this.winner !== undefined) {
                    ctx.font = "bold 36px Arial";
                    ctx.fillStyle = "#ffcc00";
                    const winnerText = this.winner === this.myId ? "🎉 你赢了！ 🎉" : "😢 对手赢了... 😢";
                    ctx.fillText(winnerText, canvas.width/2 - 120, canvas.height/2);
                }
            }
            
            serialize() {
                const positionsObj = {};
                for (const [id, pos] of this.playerPositions.entries()) {
                    positionsObj[id] = pos;
                }
                const scoresObj = {};
                for (const [id, score] of this.scores.entries()) {
                    scoresObj[id] = score;
                }
                return { playerPositions: positionsObj, scores: scoresObj, gameOver: this.gameOver, winner: this.winner };
            }
            
            deserialize(value) {
                this.playerPositions.clear();
                for (const [id, pos] of Object.entries(value.playerPositions)) {
                    this.playerPositions.set(parseInt(id), pos);
                }
                this.scores.clear();
                for (const [id, score] of Object.entries(value.scores)) {
                    this.scores.set(parseInt(id), score);
                }
                this.gameOver = value.gameOver;
                this.winner = value.winner;
            }
        }
        
        CatchGame.timestep = 1000 / 60;
        CatchGame.canvasSize = { width: 800, height: 500 };
    </script>
</body>
</html>
