<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>峰谷电费对比计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f0f4f9;
            padding: 40px 16px;
        }
        .container {
            max-width: 460px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 40, 90, 0.08);
            padding: 32px;
        }
        .title {
            text-align: center;
            font-size: 24px;
            color: #1a2b48;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #718096;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 15px;
            color: #334155;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d8e2ef;
            border-radius: 10px;
            font-size: 16px;
            color: #1a2b48;
            transition: border 0.25s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .row-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .calc-btn {
            width: 100%;
            height: 50px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s ease;
            margin-top: 10px;
        }
        .calc-btn:hover {
            background-color: #1d4ed8;
        }
        .result-card {
            margin-top: 28px;
            padding: 22px;
            border-radius: 12px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
            color: #334155;
        }
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 12px 0;
        }
        .profit-text {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding-top: 10px;
        }
        .save {
            color: #16a34a;
        }
        .loss {
            color: #dc2626;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title">峰谷电费对比计算器</h1>
    <p class="subtitle">自动对比平价电价 / 峰谷电价，计算周期盈亏</p>

    <!-- 统一平价电价单独整行 -->
    <div class="input-group">
        <label>统一平价电价(元/度)</label>
        <input type="number" step="0.0001" id="priceNormal" value="0.5283">
    </div>

    <!-- 峰、谷电价并排一行 -->
    <div class="row-wrap">
        <div class="input-group">
            <label>峰段电价(元/度)</label>
            <input type="number" step="0.0001" id="pricePeak" value="0.5583">
        </div>
        <div class="input-group">
            <label>谷段电价(元/度)</label>
            <input type="number" step="0.0001" id="priceValley" value="0.3583">
        </div>
    </div>

    <!-- 去掉当日字样，支持单日/整月数据输入 -->
    <div class="row-wrap">
        <div class="input-group">
            <label>峰用电量(度)</label>
            <input type="number" step="0.01" id="peakNum" placeholder="峰总电量">
        </div>
        <div class="input-group">
            <label>谷用电量(度)</label>
            <input type="number" step="0.01" id="valleyNum" placeholder="谷总电量">
        </div>
    </div>

    <button class="calc-btn" onclick="calculateBill()">一键计算盈亏</button>

    <div class="result-card" id="resultBox" style="display: none;">
        <div class="result-item">
            <span>不开峰谷总电费</span>
            <span id="oldCost">0.00 元</span>
        </div>
        <div class="result-item">
            <span>开通峰谷总电费</span>
            <span id="newCost">0.00 元</span>
        </div>
        <div class="divider"></div>
        <div class="profit-text" id="profitText"></div>
    </div>
</div>

<script>
function calculateBill() {
    // 获取所有输入数值
    const priceNormal = parseFloat(document.getElementById('priceNormal').value);
    const pricePeak = parseFloat(document.getElementById('pricePeak').value);
    const priceValley = parseFloat(document.getElementById('priceValley').value);
    const peakNum = parseFloat(document.getElementById('peakNum').value);
    const valleyNum = parseFloat(document.getElementById('valleyNum').value);

    // 基础校验
    if (isNaN(peakNum) || isNaN(valleyNum) || peakNum <= 0 || valleyNum <= 0) {
        alert("请填写有效的峰、谷用电量");
        return;
    }

    const totalDegree = peakNum + valleyNum;
    const costNormal = totalDegree * priceNormal;
    const costPeakValley = peakNum * pricePeak + valleyNum * priceValley;
    const difference = costNormal - costPeakValley;

    // 渲染结果
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('oldCost').innerText = costNormal.toFixed(2) + ' 元';
    document.getElementById('newCost').innerText = costPeakValley.toFixed(2) + ' 元';

    const profitDom = document.getElementById('profitText');
    if (difference >= 0) {
        profitDom.className = 'profit-text save';
        profitDom.innerText = `✅ 合计节省：${difference.toFixed(2)} 元`;
    } else {
        profitDom.className = 'profit-text loss';
        profitDom.innerText = `❌ 合计亏损：${Math.abs(difference).toFixed(2)} 元`;
    }
}
</script>
</body>
</html>
