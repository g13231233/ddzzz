<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字MMO - 实时在线游戏</title>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #1a1a2e;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 登录/注册面板 */
        .auth-panel {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: 100px auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .auth-panel h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
        }

        button {
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00a8cc;
        }

        /* 游戏主界面 */
        .game-ui {
            display: none;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .player-info {
            display: flex;
            gap: 20px;
        }

        .game-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            height: 500px;
            overflow-y: auto;
        }

        .panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 10px;
        }

        /* 战斗区域 */
        .battle-area {
            text-align: center;
        }

        .enemy-info {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .battle-btn {
            width: 48%;
            margin: 5px 1%;
        }

        /* 聊天区域 */
        .chat-messages {
            height: 380px;
            background: #0f3460;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            overflow-y: auto;
        }

        .chat-message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }

        .chat-name {
            color: #00d4ff;
            font-weight: bold;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .game-main {
                grid-template-columns: 1fr;
            }
            .auth-panel {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录注册界面 -->
        <div class="auth-panel" id="authPanel">
            <h2>文字MMO在线游戏</h2>
            <input type="email" id="email" placeholder="邮箱">
            <input type="password" id="password" placeholder="密码">
            <button onclick="register()">注册账号</button>
            <button onclick="login()">登录游戏</button>
            <div style="text-align:center; margin-top:10px;">
                <span id="authMsg" style="color:#ff4444;"></span>
            </div>
        </div>

        <!-- 游戏主界面 -->
        <div class="game-ui" id="gameUI">
            <div class="game-header">
                <div class="player-info">
                    <div>玩家：<span id="playerName"></span></div>
                    <div>职业：<span id="playerClass"></span></div>
                    <div>等级：<span id="playerLevel"></span></div>
                    <div>金币：<span id="playerGold"></span></div>
                </div>
                <button onclick="logout()" style="width:auto;">退出登录</button>
            </div>

            <div class="game-main">
                <!-- 战斗面板 -->
                <div class="panel">
                    <h3>冒险战斗</h3>
                    <div class="battle-area">
                        <div class="enemy-info">
                            <h4>野怪：<span id="enemyName">史莱姆</span></h4>
                            <p>血量：<span id="enemyHp">100</span>/100</p>
                        </div>
                        <button class="battle-btn" onclick="attackEnemy()">普通攻击</button>
                        <button class="battle-btn" onclick="useSkill()">技能攻击</button>
                        <p id="battleLog" style="margin-top:20px; color:#ffeb3b;"></p>
                    </div>
                </div>

                <!-- 聊天面板 -->
                <div class="panel">
                    <h3>世界聊天</h3>
                    <div class="chat-messages" id="chatMessages"></div>
                    <input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.keyCode==13) sendChat()">
                    <button onclick="sendChat()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase 配置（你的配置）
        const firebaseConfig = {
            apiKey: "AIzaSyCE4VKsO86HkPgfo9bDfx0oQ14zecg1wVA",
            authDomain: "durango110.firebaseapp.com",
            projectId: "durango110",
            storageBucket: "durango110.firebasestorage.app",
            messagingSenderId: "674394866246",
            appId: "1:674394866246:web:72ecd92fed2e703f124047"
        };

        // 初始化Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 全局玩家数据
        let currentUser = null;
        let playerData = {};
        let enemyData = { name: "史莱姆", hp: 100, maxHp: 100 };

        // ==================== 登录注册功能 ====================
        function register() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if(!email || !password) {
                showMsg("请输入邮箱和密码");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    currentUser = userCredential.user;
                    createPlayer();
                })
                .catch((error) => {
                    showMsg("注册失败：" + error.message);
                });
        }

        function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if(!email || !password) {
                showMsg("请输入邮箱和密码");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    currentUser = userCredential.user;
                    loadPlayerData();
                })
                .catch((error) => {
                    showMsg("登录失败：" + error.message);
                });
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById("authPanel").style.display = "block";
                document.getElementById("gameUI").style.display = "none";
            });
        }

        function showMsg(msg) {
            document.getElementById("authMsg").textContent = msg;
        }

        // ==================== 玩家数据 ====================
        function createPlayer() {
            const playerId = currentUser.uid;
            const defaultData = {
                name: "玩家" + playerId.substring(0,4),
                job: "战士",
                level: 1,
                hp: 100,
                maxHp: 100,
                attack: 20,
                skillAttack: 35,
                gold: 100,
                exp: 0
            };

            db.ref("players/" + playerId).set(defaultData)
                .then(() => {
                    loadPlayerData();
                });
        }

        function loadPlayerData() {
            const playerId = currentUser.uid;
            db.ref("players/" + playerId).on("value", (snapshot) => {
                playerData = snapshot.val();
                updatePlayerUI();
                // 显示游戏界面
                document.getElementById("authPanel").style.display = "none";
                document.getElementById("gameUI").style.display = "block";
            });
        }

        function updatePlayerUI() {
            document.getElementById("playerName").textContent = playerData.name;
            document.getElementById("playerClass").textContent = playerData.job;
            document.getElementById("playerLevel").textContent = playerData.level;
            document.getElementById("playerGold").textContent = playerData.gold;
        }

        // ==================== 战斗系统 ====================
        function attackEnemy() {
            // 玩家攻击
            const damage = playerData.attack;
            enemyData.hp -= damage;
            if(enemyData.hp < 0) enemyData.hp = 0;
            updateEnemyUI();
            showBattleLog("你对史莱姆造成了" + damage + "点伤害！");

            // 怪物死亡
            if(enemyData.hp <= 0) {
                const rewardGold = Math.floor(Math.random() * 50) + 10;
                const rewardExp = Math.floor(Math.random() * 20) + 5;
                
                playerData.gold += rewardGold;
                playerData.exp += rewardExp;
                savePlayerData();
                
                showBattleLog("史莱姆被击败！获得" + rewardGold + "金币+" + rewardExp + "经验！");
                // 重置怪物
                setTimeout(() => {
                    enemyData.hp = enemyData.maxHp;
                    updateEnemyUI();
                    showBattleLog("新的史莱姆出现了！");
                }, 1500);
                return;
            }

            // 怪物反击
            setTimeout(() => {
                const enemyDamage = Math.floor(Math.random() * 10) + 5;
                showBattleLog("史莱姆对你造成了" + enemyDamage + "点伤害！");
            }, 500);
        }

        function useSkill() {
            const damage = playerData.skillAttack;
            enemyData.hp -= damage;
            if(enemyData.hp < 0) enemyData.hp = 0;
            updateEnemyUI();
            showBattleLog("你使用技能造成了" + damage + "点伤害！");

            if(enemyData.hp <= 0) {
                const rewardGold = Math.floor(Math.random() * 50) + 10;
                const rewardExp = Math.floor(Math.random() * 20) + 5;
                
                playerData.gold += rewardGold;
                playerData.exp += rewardExp;
                savePlayerData();
                
                showBattleLog("史莱姆被秒杀！获得" + rewardGold + "金币+" + rewardExp + "经验！");
                setTimeout(() => {
                    enemyData.hp = enemyData.maxHp;
                    updateEnemyUI();
                    showBattleLog("新的史莱姆出现了！");
                }, 1500);
            }
        }

        function updateEnemyUI() {
            document.getElementById("enemyHp").textContent = enemyData.hp;
        }

        function showBattleLog(text) {
            document.getElementById("battleLog").textContent = text;
        }

        function savePlayerData() {
            db.ref("players/" + currentUser.uid).update(playerData);
        }

        // ==================== 聊天系统 ====================
        function sendChat() {
            const input = document.getElementById("chatInput");
            const msg = input.value.trim();
            if(!msg) return;

            const chatData = {
                name: playerData.name,
                content: msg,
                time: new Date().toLocaleTimeString()
            };

            db.ref("chat").push(chatData);
            input.value = "";
        }

        // 监听聊天消息
        db.ref("chat").limitToLast(50).on("child_added", (snapshot) => {
            const chat = snapshot.val();
            const chatBox = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "chat-message";
            div.innerHTML = `<span class="chat-name">${chat.name}</span> [${chat.time}]：${chat.content}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
