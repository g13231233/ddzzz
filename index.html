<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户登录留言板</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
    body{max-width:800px;margin:2rem auto;padding:0 1rem;line-height:1.5}
    .auth{margin-bottom:2rem}
    .auth input{padding:.6rem;width:100%;margin:.3rem 0}
    .auth button{padding:.6rem 1.2rem;background:#2563eb;color:white;border:none;border-radius:6px;margin-right:.5rem;cursor:pointer}
    .board{margin:2rem 0}
    .post{padding:1rem;border:1px solid #eee;border-radius:8px;margin-bottom:.8rem}
    .post .name{font-weight:bold}
    .post .time{font-size:12px;color:#666}
    .post .content{margin:.4rem 0}
    textarea{width:100%;height:80px;padding:.6rem;margin:.5rem 0}
    .user-info{color:#555;margin-bottom:1rem}
  </style>
</head>
<body>

<div class="auth">
  <h3>注册 / 登录</h3>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码（至少6位）">
  <div>
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
    <button onclick="logout()">退出登录</button>
  </div>
</div>

<div class="user-info" id="userInfo"></div>

<div class="input-box">
  <textarea id="content" placeholder="写下你的留言..."></textarea>
  <button onclick="sendMsg()">发表留言</button>
</div>

<div class="board" id="board"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ==============================================
// 在这里替换成你自己的 Supabase 项目信息
// ==============================================
const supabaseUrl = "https://eupvdbmvfqiuyverflys.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1cHZkYm12ZnFpdXl2ZXJmbHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTQyNjIsImV4cCI6MjA5MTIzMDI2Mn0._IqpB-zLhBZD5fRlnSVOaWjY3MCu2jYlRzexew8bgT0";
// ==============================================

const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// 页面加载时检查登录状态
window.onload = init;

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  showUser(user);
  loadMessages();
}

// 显示用户信息
function showUser(user) {
  const ui = document.getElementById('userInfo');
  if (user) {
    ui.innerHTML = `当前登录：${user.email}`;
  } else {
    ui.innerHTML = '未登录，请先登录';
  }
}

// 注册
async function register() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await supabase.auth.signUp({ email, password });
  if (error) alert(error.message);
  else alert('注册成功！请登录');
}

// 登录
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) alert(error.message);
  else init();
}

// 退出
async function logout() {
  await supabase.auth.signOut();
  init();
}

// 加载留言
async function loadMessages() {
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) return console.error(error);
  const board = document.getElementById('board');
  board.innerHTML = data.map(m => `
    <div class="post">
      <div class="name">${m.username || '匿名用户'}</div>
      <div class="time">${new Date(m.created_at).toLocaleString()}</div>
      <div class="content">${m.content}</div>
    </div>
  `).join('');
}

// 发表留言
async function sendMsg() {
  const content = document.getElementById('content').value.trim();
  if (!content) return alert('请输入内容');

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return alert('请先登录');

  const { error } = await supabase.from('messages').insert([{
    user_id: user.id,
    username: user.email,
    content: content
  }]);

  if (error) alert(error.message);
  else {
    document.getElementById('content').value = '';
    loadMessages();
  }
}
</script>
</body>
</html>
