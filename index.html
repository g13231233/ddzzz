<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>荒野拾荒者 - 完整版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCE4VKsO86HkPgfo9bDfx0oQ14zecg1wVA",
    authDomain: "durango110.firebaseapp.com",
    projectId: "durango110",
    storageBucket: "durango110.firebasestorage.app",
    messagingSenderId: "674394866246",
    appId: "1:674394866246:web:72ecd92fed2e703f124047"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<style>
body{margin:0;padding:0;background:#111827;color:white;font-family:system-ui}
</style>
</head>

<body>
<div class="max-w-md mx-auto h-screen flex flex-col border-x border-gray-700">

<!-- 顶部状态栏 -->
<div class="bg-gray-800 p-3 flex justify-between text-sm">
  <span id="nickname">未登录</span>
  <div>
    💰<span id="gold">0</span>
    ⚡<span id="stamina">0</span>/<span id="staminaMax">10</span>
  </div>
</div>

<!-- 内容区 -->
<div id="content" class="flex-1 overflow-y-auto p-3">
  <div id="page-home" class="block text-center py-10">
    <button onclick="doScavenge()" class="bg-blue-600 text-white text-xl font-bold w-full py-5 rounded-lg mb-4">
      🔍 点击拾荒（消耗1点体力）
    </button>
  </div>

  <div id="page-bag" class="hidden">
    <h2 class="text-lg font-bold mb-2">背包</h2>
    <div id="bagList" class="grid grid-cols-2 gap-2"></div>
  </div>

  <div id="page-craft" class="hidden">
    <h2 class="text-lg font-bold mb-2">制作</h2>
    <div id="craftList" class="space-y-2"></div>
  </div>

  <div id="page-book" class="hidden">
    <h2 class="text-lg font-bold mb-2">图鉴</h2>
    <div id="bookList" class="grid grid-cols-2 gap-2"></div>
  </div>

  <div id="page-market" class="hidden">
    <h2 class="text-lg font-bold mb-2">市场</h2>
    <input placeholder="搜索物品" oninput="searchMarket()" class="w-full p-2 rounded bg-gray-700 mb-2" id="marketSearch">
    <div id="marketItems" class="space-y-2"></div>
  </div>

  <div id="page-skill" class="hidden">
    <h2 class="text-lg font-bold mb-2">技能</h2>
    <div id="skillList" class="space-y-2"></div>
  </div>

  <div id="page-rank" class="hidden">
    <h2 class="text-lg font-bold mb-2">排行榜</h2>
    <div id="rankList" class="space-y-1"></div>
  </div>
</div>

<!-- 信息/聊天 切换 -->
<div class="p-2">
  <div class="flex gap-1 mb-1">
    <button onclick="switchTab('msg')" class="flex-1 py-1 bg-gray-700 rounded" id="tab-msg">系统信息</button>
    <button onclick="switchTab('chat')" class="flex-1 py-1 bg-gray-600 rounded" id="tab-chat">玩家聊天</button>
  </div>
  <div class="h-32 bg-gray-800 rounded p-2 overflow-y-auto text-sm">
    <div id="msgArea"></div>
    <div id="chatArea" class="hidden"></div>
  </div>
  <input id="chatInput" placeholder="输入聊天内容..." onkeydown="if(event.key=='Enter')sendChat()" class="w-full p-1 mt-1 rounded bg-gray-700">
</div>

<!-- 底部导航 -->
<div class="grid grid-cols-6 bg-gray-800 p-1 text-xs">
  <button onclick="show('home')">首页</button>
  <button onclick="show('bag')">背包</button>
  <button onclick="show('craft')">制作</button>
  <button onclick="show('book')">图鉴</button>
  <button onclick="show('market')">市场</button>
  <button onclick="show('rank')">排行</button>
</div>

</div>

<script>
let user = null;
let player = {
  name: "拾荒者", gold:1000, stamina:10, staminaMax:10,
  inventory:{}, book:[], skills:{staminaMax:1, recover:1, luck:1}
};

const items = [
  {id:"wood", name:"木材", type:"mat", rarity:"普通"},
  {id:"stone", name:"石头", type:"mat", rarity:"普通"},
  {id:"metal", name:"金属", type:"mat", rarity:"稀有"},
  {id:"chip", name:"芯片", type:"mat", rarity:"史诗"},
  {id:"sword", name:"铁剑", type:"craft", need:{metal:2,wood:1}},
  {id:"shield", name:"盾牌", type:"craft", need:{metal:3,stone:2}},
];

auth.onAuthStateChanged(async u=>{
  if(!u){
    await auth.signInAnonymously();
    return;
  }
  user = u;
  const doc = await db.collection("players").doc(u.uid).get();
  if(doc.exists) player = doc.data();
  else await db.collection("players").doc(u.uid).set(player);
  startStaminaRecover();
  refreshUI();
});

function refreshUI(){
  document.getElementById("gold").innerText = player.gold;
  document.getElementById("stamina").innerText = player.stamina;
  document.getElementById("staminaMax").innerText = player.staminaMax;
  document.getElementById("nickname").innerText = player.name;
}

function doScavenge(){
  if(player.stamina<1){addMsg("体力不足");return}
  player.stamina--;
  const item = items[Math.floor(Math.random()*4)];
  player.inventory[item.id] = (player.inventory[item.id]||0)+1;
  addMsg(`拾荒获得：${item.name}`);
  savePlayer();
  refreshUI();
}

function craft(id){
  const cfg = items.find(i=>i.id==id);
  if(!cfg || !cfg.need) return;
  for(let m in cfg.need){
    if((player.inventory[m]||0)<cfg.need[m]){
      addMsg("材料不足");return;
    }
  }
  for(let m in cfg.need) player.inventory[m]-=cfg.need[m];
  player.inventory[id]=(player.inventory[id]||0)+1;
  if(!player.book.includes(id))player.book.push(id);
  addMsg(`制作成功：${cfg.name}`);
  savePlayer();
  refreshUI();
}

async function savePlayer(){
  if(user) await db.collection("players").doc(user.uid).set(player);
}

function addMsg(text){
  const d = new Date();
  const t = `[${d.getHours()}:${d.getMinutes()}] `;
  document.getElementById("msgArea").innerHTML += t+text+"<br>";
  document.getElementById("msgArea").scrollTop=9999;
}

function sendChat(){
  const txt = document.getElementById("chatInput").value;
  if(!txt||!user)return;
  db.collection("chat").add({
    name:player.name, msg:txt, time:new Date()
  });
  document.getElementById("chatInput").value="";
}

db.collection("chat").orderBy("time").onSnapshot(snap=>{
  let html="";
  snap.forEach(d=>{
    html+=`<b>${d.data().name}：</b>${d.data().msg}<br>`;
  });
  document.getElementById("chatArea").innerHTML=html;
  document.getElementById("chatArea").scrollTop=9999;
});

function switchTab(to){
  const isMsg = to=="msg";
  document.getElementById("msgArea").classList.toggle("hidden",!isMsg);
  document.getElementById("chatArea").classList.toggle("hidden",isMsg);
  document.getElementById("tab-msg").classList.toggle("bg-gray-600",!isMsg);
  document.getElementById("tab-msg").classList.toggle("bg-gray-700",isMsg);
  document.getElementById("tab-chat").classList.toggle("bg-gray-600",isMsg);
  document.getElementById("tab-chat").classList.toggle("bg-gray-700",!isMsg);
}

function show(page){
  document.querySelectorAll("[id^='page-']").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+page).classList.remove("hidden");
  if(page=="bag")renderBag();
  if(page=="craft")renderCraft();
  if(page=="book")renderBook();
  if(page=="skill")renderSkill();
}

function renderBag(){
  let h="";
  for(let id in player.inventory){
    const num=player.inventory[id];
    const it=items.find(i=>i.id==id);
    if(it&&num>0)h+=`<div class="p-2 bg-gray-700 rounded">${it.name} ×${num}</div>`;
  }
  document.getElementById("bagList").innerHTML=h||"<div class='text-gray-400'>空</div>";
}

function renderCraft(){
  let h="";
  items.filter(i=>i.type=="craft").forEach(it=>{
    h+=`<div class="p-2 bg-gray-700 rounded">
      ${it.name} <button onclick="craft('${it.id}')" class="bg-blue-600 px-2 rounded">制作</button>
    </div>`;
  });
  document.getElementById("craftList").innerHTML=h;
}

function renderBook(){
  let h="";
  items.filter(i=>i.type=="craft").forEach(it=>{
    const ok=player.book.includes(it.id);
    h+=`<div class='p-2 rounded ${ok?"bg-green-900":"bg-gray-700"}'>${it.name} ${ok?"✅":"🔒"}</div>`;
  });
  document.getElementById("bookList").innerHTML=h;
}

function renderSkill(){
  document.getElementById("skillList").innerHTML=`
    <div class="p-2 bg-gray-700 rounded">体力上限 Lv${player.skills.staminaMax} <button onclick="upStaminaMax()" class="bg-blue-600 px-2 rounded">升级</button></div>
    <div class="p-2 bg-gray-700 rounded">体力恢复 Lv${player.skills.recover} <button onclick="upRecover()" class="bg-blue-600 px-2 rounded">升级</button></div>
  `;
}

function upStaminaMax(){
  player.staminaMax+=5; player.skills.staminaMax++; savePlayer(); refreshUI(); renderSkill();
}
function upRecover(){
  player.skills.recover++; savePlayer(); refreshUI(); renderSkill();
}

function startStaminaRecover(){
  setInterval(()=>{
    if(player.stamina<player.staminaMax){
      player.stamina+=player.skills.recover;
      if(player.stamina>player.staminaMax)player.stamina=player.staminaMax;
      savePlayer();refreshUI();
    }
  },5000);
}

function searchMarket(){}
</script>
</body>
</html>
