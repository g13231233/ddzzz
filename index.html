<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>局域网联机 - 好友对战</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 3px solid #00d9ff;
            border-radius: 10px;
            background: #0f0f23;
        }
        .panel {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 500px;
        }
        button {
            background: #00d9ff;
            border: none;
            padding: 10px 25px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        input {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
            width: 200px;
        }
        .room-code {
            font-size: 32px;
            font-family: monospace;
            background: #0f0f23;
            padding: 15px;
            border-radius: 10px;
            letter-spacing: 5px;
        }
        .status {
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🎮 局域网联机 - 触碰对战</h1>
    
    <div id="lobby">
        <div class="panel">
            <h3>🔗 连接方式</h3>
            <p>同一 WiFi 下，一方创建房间，另一方输入房间码加入</p>
            <button onclick="createRoom()">🏠 创建房间（主机）</button>
            <button onclick="showJoin()">🔌 加入房间</button>
        </div>
        
        <div id="joinPanel" class="panel" style="display:none">
            <h3>🔌 加入房间</h3>
            <input type="text" id="roomCode" placeholder="输入房间码">
            <button onclick="joinRoom()">加入</button>
        </div>
        
        <div id="statusPanel" class="panel">
            <div id="statusMsg">💡 等待操作...</div>
        </div>
    </div>
    
    <div id="gameArea" style="display:none">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="panel">
            <div id="gameStatus">🎮 游戏中</div>
            <div>🎯 红色=你，蓝色=对手 | 移动触碰对手得分！先得5分获胜</div>
            <div>⌨️ 控制: WASD 或 方向键</div>
        </div>
    </div>

    <script>
        // ========== 游戏状态 ==========
        let peer = null;
        let conn = null;
        let isHost = false;
        let myId = null;
        let gameRunning = false;
        
        // 游戏数据
        let players = {
            local: { x: 100, y: 250, score: 0, id: 'local' },
            remote: { x: 700, y: 250, score: 0, id: 'remote' }
        };
        let gameOver = false;
        let winner = null;
        
        // Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 键盘控制
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
        
        // ========== PeerJS 初始化 ==========
        function createRoom() {
            isHost = true;
            document.getElementById('statusMsg').innerHTML = '🔄 正在创建房间...';
            
            // 创建 Peer 对象（使用免费的公共信令服务器）
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('statusMsg').innerHTML = `
                    ✅ 房间创建成功！<br>
                    📋 房间码: <span class="room-code">${id}</span><br>
                    👥 把房间码告诉朋友，让他点击"加入房间"
                `;
                document.getElementById('joinPanel').style.display = 'none';
            });
            
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('statusMsg').innerHTML = '✅ 对手已连接！游戏开始！';
                startGame();
            });
            
            peer.on('error', (err) => {
                document.getElementById('statusMsg').innerHTML = `❌ 错误: ${err.type}<br>刷新页面重试`;
                console.error(err);
            });
        }
        
        function showJoin() {
            document.getElementById('joinPanel').style.display = 'block';
        }
        
        function joinRoom() {
            const roomCode = document.getElementById('roomCode').value.trim();
            if (!roomCode) {
                alert('请输入房间码');
                return;
            }
            
            isHost = false;
            document.getElementById('statusMsg').innerHTML = '🔄 正在加入房间...';
            
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                myId = id;
                conn = peer.connect(roomCode);
                setupConnection();
                document.getElementById('statusMsg').innerHTML = '🔄 正在连接对手...';
            });
            
            peer.on('error', (err) => {
                document.getElementById('statusMsg').innerHTML = `❌ 连接失败: ${err.type}<br>检查房间码是否正确`;
                console.error(err);
            });
        }
        
        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('statusMsg').innerHTML = '✅ 连接成功！游戏开始！';
                startGame();
            });
            
            conn.on('data', (data) => {
                handleRemoteData(data);
            });
            
            conn.on('error', (err) => {
                console.error('Connection error:', err);
                document.getElementById('statusMsg').innerHTML = '❌ 连接断开，刷新页面重试';
            });
        }
        
        // ========== 游戏逻辑 ==========
        function startGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            gameRunning = true;
            
            // 重置游戏状态
            players = {
                local: { x: isHost ? 100 : 700, y: 250, score: 0, id: 'local' },
                remote: { x: isHost ? 700 : 100, y: 250, score: 0, id: 'remote' }
            };
            gameOver = false;
            winner = null;
            
            // 开始游戏循环
            requestAnimationFrame(gameLoop);
            
            // 键盘监听
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
        }
        
        function handleKeyDown(e) {
            if (!gameRunning || gameOver) return;
            const key = e.key;
            if (keys.hasOwnProperty(key)) keys[key] = true;
            // 防止页面滚动
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 's', 'a', 'd'].includes(key)) {
                e.preventDefault();
            }
        }
        
        function handleKeyUp(e) {
            const key = e.key;
            if (keys.hasOwnProperty(key)) keys[key] = false;
        }
        
        function updateLocalPosition() {
            let velX = 0, velY = 0;
            if (keys.ArrowLeft || keys.a) velX = -1;
            if (keys.ArrowRight || keys.d) velX = 1;
            if (keys.ArrowUp || keys.w) velY = -1;
            if (keys.ArrowDown || keys.s) velY = 1;
            
            if (velX !== 0 || velY !== 0) {
                const len = Math.hypot(velX, velY);
                velX /= len;
                velY /= len;
            }
            
            const speed = 6;
            let newX = players.local.x + velX * speed;
            let newY = players.local.y + velY * speed;
            
            newX = Math.max(30, Math.min(770, newX));
            newY = Math.max(30, Math.min(470, newY));
            
            players.local.x = newX;
            players.local.y = newY;
            
            // 发送位置给对手
            if (conn && conn.open) {
                conn.send({
                    type: 'move',
                    x: newX,
                    y: newY
                });
            }
        }
        
        function handleRemoteData(data) {
            if (data.type === 'move') {
                players.remote.x = data.x;
                players.remote.y = data.y;
            } else if (data.type === 'score') {
                players.remote.score = data.score;
                if (data.gameOver) {
                    gameOver = true;
                    winner = 'remote';
                }
            } else if (data.type === 'reset') {
                // 重置位置
                players.local.x = isHost ? 100 : 700;
                players.local.y = 250;
                players.remote.x = isHost ? 700 : 100;
                players.remote.y = 250;
            }
        }
        
        function checkCollision() {
            const dx = players.local.x - players.remote.x;
            const dy = players.local.y - players.remote.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance < 40 && !gameOver) {
                // 触碰得分
                players.local.score++;
                
                // 重置位置
                players.local.x = isHost ? 100 : 700;
                players.local.y = 250;
                players.remote.x = isHost ? 700 : 100;
                players.remote.y = 250;
                
                // 通知对手重置位置
                if (conn && conn.open) {
                    conn.send({ type: 'reset' });
                }
                
                // 检查胜利
                if (players.local.score >= 5) {
                    gameOver = true;
                    winner = 'local';
                    if (conn && conn.open) {
                        conn.send({ type: 'score', score: players.remote.score, gameOver: true });
                    }
                } else {
                    // 发送分数更新
                    if (conn && conn.open) {
                        conn.send({ type: 'score', score: players.local.score, gameOver: false });
                    }
                }
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, 800, 500);
            
            // 绘制网格
            ctx.strokeStyle = '#2a2a4a';
            ctx.lineWidth = 1;
            for (let i = 0; i < 800; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 500);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.stroke();
            }
            
            // 绘制本地玩家
            ctx.fillStyle = '#ff4444';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0000';
            ctx.fillRect(players.local.x - 20, players.local.y - 20, 40, 40);
            
            // 绘制对手
            ctx.fillStyle = '#4488ff';
            ctx.shadowColor = '#0088ff';
            ctx.fillRect(players.remote.x - 20, players.remote.y - 20, 40, 40);
            ctx.shadowBlur = 0;
            
            // 玩家标签
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('你', players.local.x - 8, players.local.y + 6);
            ctx.fillText('对手', players.remote.x - 8, players.remote.y + 6);
            
            // 分数
            ctx.font = 'bold 28px Arial';
            ctx.fillStyle = '#ff8888';
            ctx.fillText(`${players.local.score}`, 60, 60);
            ctx.fillStyle = '#8888ff';
            ctx.fillText(`${players.remote.score}`, 730, 60);
            
            // 胜利文字
            if (gameOver) {
                ctx.font = 'bold 36px Arial';
                ctx.fillStyle = '#ffcc00';
                const winText = winner === 'local' ? '🎉 你赢了！ 🎉' : '😢 对手赢了... 😢';
                ctx.fillText(winText, 800/2 - 120, 500/2);
            }
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            if (!gameOver) {
                updateLocalPosition();
                checkCollision();
            }
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 清理
        window.addEventListener('beforeunload', () => {
            if (peer) peer.destroy();
        });
    </script>
    
    <!-- PeerJS 库 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</body>
</html>
