<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简导航站</title>
    <style>
        /* 全局重置+基础样式：极致干净 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* 导航栏：简单线条装饰 */
        .nav-header {
            border-bottom: 1px solid #e9ecef; /* 仅底部简单线条 */
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 10;
        }
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 4rem; /* 间距适中，视觉干净 */
        }
        .nav-item {
            font-size: 16px;
            color: #495057;
            text-decoration: none;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.2s;
        }
        /* 选中态：底部简单线条标识 */
        .nav-item.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #4299e1; /* 柔和主色线条 */
        }
        .nav-item:hover {
            color: #4299e1;
        }

        /* 内容区域通用样式 */
        .content {
            padding: 3rem 0;
            min-height: calc(100vh - 120px);
        }
        .content-section {
            display: none; /* 默认隐藏所有模块 */
        }
        .content-section.active {
            display: block; /* 仅显示选中模块 */
        }

        /* 1. 网站合集模块：极简卡片+简单线条 */
        .links-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .link-card {
            background: #fff;
            padding: 1.2rem;
            border-radius: 6px;
            border: 1px solid #e9ecef; /* 简单边框线条 */
            text-align: center;
        }
        .link-card a {
            color: #4299e1;
            text-decoration: none;
            font-size: 15px;
            display: block;
        }
        .link-card a:hover {
            color: #3182ce;
        }

        /* 2. 关于本站模块：简单线条分隔 */
        .about-wrap {
            background: #fff;
            padding: 2rem;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            max-width: 800px;
            margin: 0 auto;
        }
        .about-title {
            font-size: 18px;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #e9ecef; /* 简单分隔线 */
        }
        .about-desc {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.8;
        }

        /* 3. 友情赞助模块：仅保留收款码，简单线条装饰 */
        .sponsor-wrap {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 收款码区域设计 */
        .qr-section {
            background: #fff;
            padding: 2rem;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            margin-bottom: 2rem;
            text-align: center;
        }
        .qr-title {
            font-size: 18px;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #e9ecef;
            display: inline-block;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .qr-item {
            text-align: center;
        }
        .qr-img {
            width: 180px;
            height: 180px;
            border: 1px solid #e9ecef; /* 收款码边框线条 */
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.8rem;
        }
        .qr-desc {
            font-size: 14px;
            color: #6c757d;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .nav-container {
                gap: 2rem;
            }
            .qr-container {
                gap: 1.5rem;
            }
            .qr-img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏：仅简单线条装饰 -->
    <header class="nav-header">
        <div class="container nav-container">
            <a href="javascript:;" class="nav-item active" data-target="links-section">网站合集</a>
            <a href="javascript:;" class="nav-item" data-target="about-section">关于本站</a>
            <a href="javascript:;" class="nav-item" data-target="sponsor-section">友情赞助</a>
        </div>
    </header>

    <!-- 内容区域 -->
    <main class="content container">
        <!-- 1. 网站合集模块 -->
        <section id="links-section" class="content-section active">
            <div class="links-wrap">
                <div class="link-card">
                    <a href="https://github.com" target="_blank">GitHub</a>
                </div>
                <div class="link-card">
                    <a href="https://developer.mozilla.org" target="_blank">MDN文档</a>
                </div>
                <div class="link-card">
                    <a href="https://www.runoob.com" target="_blank">菜鸟教程</a>
                </div>
                <div class="link-card">
                    <a href="https://www.feishu.cn" target="_blank">飞书</a>
                </div>
                <div class="link-card">
                    <a href="https://www.bilibili.com" target="_blank">B站</a>
                </div>
                <div class="link-card">
                    <a href="https://www.figma.com" target="_blank">Figma</a>
                </div>
                <div class="link-card">
                    <a href="https://www.yuque.com" target="_blank">语雀</a>
                </div>
                <div class="link-card">
                    <a href="https://www.notion.so" target="_blank">Notion</a>
                </div>
            </div>
        </section>

        <!-- 2. 关于本站模块 -->
        <section id="about-section" class="content-section">
            <div class="about-wrap">
                <h3 class="about-title">关于本站</h3>
                <p class="about-desc">
                    本站是一个极简风格的导航网站，旨在为用户提供干净、高效的网页收藏服务。<br><br>
                    我们坚持无广告、无弹窗、纯静态的设计理念，所有链接均为实用的优质网站，帮助你快速访问常用资源。<br><br>
                    如果你有好的网站推荐，或者发现链接失效，欢迎通过赞助区的联系方式反馈，感谢你的支持！
                </p>
            </div>
        </section>

        <!-- 3. 友情赞助模块：仅保留收款码区域 -->
        <section id="sponsor-section" class="content-section">
            <div class="sponsor-wrap">
                <!-- 收款码区域 -->
                <div class="qr-section">
                    <h3 class="qr-title">支持本站</h3>
                    <div class="qr-container">
                        <div class="qr-item">
                            <img src="https://via.placeholder.com/180" alt="微信收款码" class="qr-img">
                            <p class="qr-desc">微信支付</p>
                        </div>
                        <div class="qr-item">
                            <img src="https://via.placeholder.com/180" alt="支付宝收款码" class="qr-img">
                            <p class="qr-desc">支付宝</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 导航切换逻辑：纯静态，无多余特效
        const navItems = document.querySelectorAll('.nav-item');
        const contentSections = document.querySelectorAll('.content-section');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                // 移除所有选中态
                navItems.forEach(nav => nav.classList.remove('active'));
                contentSections.forEach(section => section.classList.remove('active'));
                
                // 添加当前选中态
                item.classList.add('active');
                const targetId = item.dataset.target;
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>
