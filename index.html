<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 多人BOSS战 - 炎魔领主</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 900px;
        }

        /* 通用卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 登录/注册容器 */
        #auth-container {
            text-align: center;
        }

        #auth-container h2 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        #auth-container .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            max-width: 350px;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        /* 游戏主界面 */
        #game-container {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .user-email {
            color: #ff6b6b;
        }

        /* 房间列表 */
        #room-list-container h3, #battle-container h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .create-room {
            display: flex;
            gap: 10px;
        }

        .create-room input {
            padding: 10px 15px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            outline: none;
        }

        .room-list {
            display: grid;
            gap: 15px;
        }

        .room-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .room-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .room-info h4 {
            color: #ff9f43;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .room-info p {
            color: #aaa;
            font-size: 0.9em;
        }

        .room-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-waiting {
            background: #2ed573;
            color: white;
        }

        .status-fighting {
            background: #ff6b6b;
            color: white;
        }

        .status-ended {
            background: #747d8c;
            color: white;
        }

        /* 战斗界面 */
        #battle-container {
            display: none;
        }

        .boss-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .boss-name {
            color: #ff6b6b;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .boss-avatar {
            font-size: 6em;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255, 107, 107, 0.6));
            animation: bossFloat 3s ease-in-out infinite;
        }

        @keyframes bossFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hp-bar-container {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff9f43, #2ed573);
            border-radius: 15px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .boss-hp-text {
            color: white;
            font-size: 1.2em;
            font-weight: bold;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0;
        }

        .attack-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .attack-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
        }

        .attack-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .my-damage {
            color: #ff9f43;
            font-size: 1.2em;
        }

        .ranking-section {
            margin-top: 30px;
        }

        .ranking-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 15px;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-rank {
            color: #ff9f43;
            font-weight: bold;
        }

        .ranking-damage {
            color: #2ed573;
            font-weight: bold;
        }

        .battle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-count {
            color: #aaa;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .victory-message {
            text-align: center;
            color: #2ed573;
            font-size: 2em;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(46, 213, 115, 0.5);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 登录注册界面 -->
        <div id="auth-container" class="card">
            <h2>🔥 炎魔领主</h2>
            <p class="subtitle">多人协作BOSS战</p>
            <div class="input-group">
                <input type="email" id="email" placeholder="邮箱" />
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="密码（至少6位）" />
            </div>
            <div id="auth-error" class="error-message"></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="login-btn">登录</button>
                <button class="btn btn-secondary" id="register-btn">注册</button>
            </div>
            <p style="color: #aaa; margin-top: 20px; font-size: 0.85em;">
                首次使用请点击注册，密码至少6位
            </p>
        </div>

        <!-- 游戏主界面 -->
        <div id="game-container">
            <div class="header">
                <h2 style="color: #ff6b6b;">🔥 炎魔领主·多人讨伐</h2>
                <div class="user-info">
                    <span>欢迎，<span id="user-email" class="user-email"></span></span>
                    <button class="btn btn-secondary btn-small" id="logout-btn">登出</button>
                </div>
            </div>

            <!-- 房间列表界面 -->
            <div id="room-list-container" class="card">
                <div class="room-header">
                    <h3>📋 讨伐房间</h3>
                    <div class="create-room">
                        <input type="text" id="room-name-input" placeholder="房间名称" maxlength="20" />
                        <button class="btn btn-primary btn-small" id="create-room-btn">创建房间</button>
                    </div>
                </div>
                <div id="room-list" class="room-list">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>

            <!-- 战斗界面 -->
            <div id="battle-container" class="card">
                <div class="battle-header">
                    <button class="back-btn" id="leave-battle-btn">← 返回房间列表</button>
                    <span class="player-count" id="player-count">👥 0 人战斗中</span>
                </div>
                
                <div class="boss-section">
                    <div class="boss-name" id="boss-name">炎魔领主</div>
                    <div class="boss-avatar">👹</div>
                    <div class="hp-bar-container">
                        <div id="boss-hp-bar" class="hp-bar" style="width: 100%;"></div>
                    </div>
                    <div class="boss-hp-text" id="boss-hp-text">10000 / 10000</div>
                </div>

                <div id="victory-message" class="victory-message" style="display: none;">
                    🎉 胜利！炎魔领主已被击败！ 🎉
                </div>

                <div class="player-section">
                    <button class="attack-btn" id="attack-btn">⚔️ 攻击 (100伤害)</button>
                    <div class="my-damage">
                        我的输出: <span id="my-damage">0</span> 伤害
                    </div>
                </div>

                <div class="ranking-section">
                    <h3 style="color: white; margin-bottom: 15px;">🏆 伤害排行榜</h3>
                    <div id="damage-ranking" class="ranking-list">
                        <div class="empty-state">暂无数据</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Firebase 配置
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore,
            collection,
            addDoc,
            getDocs,
            doc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp,
            arrayUnion,
            arrayRemove,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { 
            getDatabase,
            ref,
            set,
            get,
            update,
            onValue,
            runTransaction,
            onDisconnect,
            remove
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // 你的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCE4VKsO86HkPgfo9bDfx0oQ14zecg1wVA",
            authDomain: "durango110.firebaseapp.com",
            projectId: "durango110",
            storageBucket: "durango110.firebasestorage.app",
            messagingSenderId: "674394866246",
            appId: "1:674394866246:web:72ecd92fed2e703f124047",
            databaseURL: "https://durango110-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // 游戏配置
        const BOSS_MAX_HP = 10000;
        const ATTACK_DAMAGE = 100;
        const ATTACK_COOLDOWN = 500; // 毫秒

        // 全局状态
        let currentUser = null;
        let currentRoom = null;
        let canAttack = true;
        let battleUnsubscribe = null;
        let roomsUnsubscribe = null;

        // DOM 元素
        const authContainer = document.getElementById('auth-container');
        const gameContainer = document.getElementById('game-container');
        const roomListContainer = document.getElementById('room-list-container');
        const battleContainer = document.getElementById('battle-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        const userEmailSpan = document.getElementById('user-email');
        const roomList = document.getElementById('room-list');
        const roomNameInput = document.getElementById('room-name-input');
        const bossHpBar = document.getElementById('boss-hp-bar');
        const bossHpText = document.getElementById('boss-hp-text');
        const myDamageSpan = document.getElementById('my-damage');
        const damageRanking = document.getElementById('damage-ranking');
        const playerCountSpan = document.getElementById('player-count');
        const victoryMessage = document.getElementById('victory-message');
        const attackBtn = document.getElementById('attack-btn');

        // ============ 认证相关 ============
        async function handleRegister() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                authError.textContent = '请输入邮箱和密码';
                return;
            }
            if (password.length < 6) {
                authError.textContent = '密码至少需要6位';
                return;
            }
            
            try {
                authError.textContent = '';
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authError.textContent = getAuthErrorMessage(error.code);
            }
        }

        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                authError.textContent = '请输入邮箱和密码';
                return;
            }
            
            try {
                authError.textContent = '';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authError.textContent = getAuthErrorMessage(error.code);
            }
        }

        async function handleLogout() {
            try {
                if (currentRoom) {
                    await leaveRoom();
                }
                await signOut(auth);
            } catch (error) {
                console.error('登出失败:', error);
            }
        }

        function getAuthErrorMessage(code) {
            const messages = {
                'auth/invalid-email': '邮箱格式不正确',
                'auth/user-disabled': '该账号已被禁用',
                'auth/user-not-found': '账号不存在',
                'auth/wrong-password': '密码错误',
                'auth/email-already-in-use': '该邮箱已被注册',
                'auth/weak-password': '密码强度不足',
                'auth/network-request-failed': '网络连接失败',
                'auth/too-many-requests': '请求过于频繁，请稍后再试'
            };
            return messages[code] || '操作失败，请重试';
        }

        // ============ 房间相关 ============
        async function createRoom() {
            const roomName = roomNameInput.value.trim() || `${currentUser.email?.split('@')[0] || '玩家'}的房间`;
            
            try {
                // 创建房间
                const roomRef = await addDoc(collection(db, "rooms"), {
                    name: roomName,
                    hostId: currentUser.uid,
                    hostEmail: currentUser.email,
                    players: [{
                        uid: currentUser.uid,
                        email: currentUser.email,
                        joinedAt: serverTimestamp(),
                        damage: 0
                    }],
                    bossHp: BOSS_MAX_HP,
                    maxHp: BOSS_MAX_HP,
                    status: 'waiting',
                    createdAt: serverTimestamp()
                });

                // 初始化实时战斗数据
                const battleRef = ref(rtdb, `battles/${roomRef.id}`);
                await set(battleRef, {
                    bossHp: BOSS_MAX_HP,
                    playerActions: {},
                    playerDamage: {},
                    players: {
                        [currentUser.uid]: {
                            email: currentUser.email,
                            online: true
                        }
                    }
                });

                roomNameInput.value = '';
                await enterRoom(roomRef.id);
            } catch (error) {
                console.error('创建房间失败:', error);
                alert('创建房间失败: ' + error.message);
            }
        }

        async function joinRoomById(roomId) {
            try {
                await enterRoom(roomId);
            } catch (error) {
                console.error('加入房间失败:', error);
                alert('加入房间失败: ' + error.message);
            }
        }

        async function enterRoom(roomId) {
            // 如果已在其他房间，先离开
            if (currentRoom) {
                await leaveRoom();
            }

            const roomRef = doc(db, "rooms", roomId);
            const battleRef = ref(rtdb, `battles/${roomId}`);

            try {
                // 更新 Firestore 中的玩家列表
                await updateDoc(roomRef, {
                    players: arrayUnion({
                        uid: currentUser.uid,
                        email: currentUser.email,
                        joinedAt: new Date(),
                        damage: 0
                    })
                });

                // 更新 Realtime DB 中的在线玩家
                const playerRef = ref(rtdb, `battles/${roomId}/players/${currentUser.uid}`);
                await set(playerRef, {
                    email: currentUser.email,
                    online: true
                });

                // 设置断线自动清理
                onDisconnect(playerRef).remove();

                currentRoom = roomId;
                
                // 切换到战斗界面
                roomListContainer.style.display = 'none';
                battleContainer.style.display = 'block';
                
                // 开始监听战斗数据
                listenBattle(roomId);
                
                // 监听房间状态变化
                listenRoomStatus(roomId);
                
            } catch (error) {
                console.error('进入房间失败:', error);
                throw error;
            }
        }

        async function leaveRoom() {
            if (!currentRoom) return;

            const roomRef = doc(db, "rooms", currentRoom);
            const playerRef = ref(rtdb, `battles/${currentRoom}/players/${currentUser.uid}`);

            try {
                // 从 Firestore 移除玩家
                const roomSnap = await getDocs(query(collection(db, "rooms")));
                roomSnap.forEach(async (docSnap) => {
                    if (docSnap.id === currentRoom) {
                        const data = docSnap.data();
                        const updatedPlayers = data.players.filter(p => p.uid !== currentUser.uid);
                        await updateDoc(doc(db, "rooms", currentRoom), {
                            players: updatedPlayers
                        });
                    }
                });

                // 从 Realtime DB 移除
                await remove(playerRef);
                
            } catch (error) {
                console.error('离开房间失败:', error);
            }

            // 取消监听
            if (battleUnsubscribe) {
                battleUnsubscribe();
                battleUnsubscribe = null;
            }

            currentRoom = null;
        }

        function listenRoomStatus(roomId) {
            const roomRef = doc(db, "rooms", roomId);
            onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data.status === 'ended') {
                        // 房间已结束
                        alert('战斗已结束！');
                        backToRoomList();
                    }
                }
            });
        }

        async function backToRoomList() {
            await leaveRoom();
            battleContainer.style.display = 'none';
            roomListContainer.style.display = 'block';
            victoryMessage.style.display = 'none';
        }

        // ============ 战斗相关 ============
        function listenBattle(roomId) {
            const battleRef = ref(rtdb, `battles/${roomId}`);
            
            battleUnsubscribe = onValue(battleRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                updateBattleUI(data);
                
                // 检查 Boss 是否死亡
                if (data.bossHp <= 0) {
                    handleBossDefeated(roomId);
                }
            });
        }

        function updateBattleUI(data) {
            const bossHp = data.bossHp || BOSS_MAX_HP;
            const hpPercent = (bossHp / BOSS_MAX_HP) * 100;
            const myDamage = data.playerDamage?.[currentUser.uid] || 0;
            const players = data.players || {};
            const onlineCount = Object.values(players).filter(p => p.online).length;

            // 更新 Boss 血条
            bossHpBar.style.width = Math.max(0, hpPercent) + '%';
            bossHpText.textContent = `${Math.max(0, bossHp)} / ${BOSS_MAX_HP}`;
            
            // 更新我的伤害
            myDamageSpan.textContent = myDamage;
            
            // 更新在线人数
            playerCountSpan.textContent = `👥 ${onlineCount} 人战斗中`;
            
            // 更新排行榜
            updateRanking(data.playerDamage || {}, players);
            
            // 如果 Boss 死亡，禁用攻击按钮
            if (bossHp <= 0) {
                attackBtn.disabled = true;
            } else {
                attackBtn.disabled = false;
            }
        }

        function updateRanking(damages, players) {
            if (!damages || Object.keys(damages).length === 0) {
                damageRanking.innerHTML = '<div class="empty-state">暂无伤害数据</div>';
                return;
            }

            // 转换为数组并排序
            const ranking = Object.entries(damages)
                .map(([uid, damage]) => ({
                    uid,
                    damage,
                    email: players[uid]?.email || '未知玩家'
                }))
                .sort((a, b) => b.damage - a.damage)
                .slice(0, 10);

            damageRanking.innerHTML = ranking.map((item, index) => {
                const isMe = item.uid === currentUser.uid;
                return `
                    <div class="ranking-item" style="${isMe ? 'background: rgba(255, 107, 107, 0.2);' : ''}">
                        <span>
                            <span class="ranking-rank">#${index + 1}</span>
                            ${item.email.split('@')[0]}
                            ${isMe ? ' (我)' : ''}
                        </span>
                        <span class="ranking-damage">${item.damage} 伤害</span>
                    </div>
                `;
            }).join('');
        }

        async function handleAttack() {
            if (!currentRoom || !canAttack) return;
            
            canAttack = false;
            attackBtn.disabled = true;
            
            try {
                const hpRef = ref(rtdb, `battles/${currentRoom}/bossHp`);
                const damageRef = ref(rtdb, `battles/${currentRoom}/playerDamage/${currentUser.uid}`);
                
                // 原子操作：扣血
                await runTransaction(hpRef, (currentHp) => {
                    if (currentHp === null) return BOSS_MAX_HP;
                    return Math.max(0, currentHp - ATTACK_DAMAGE);
                });
                
                // 累加伤害
                await runTransaction(damageRef, (currentDamage) => {
                    return (currentDamage || 0) + ATTACK_DAMAGE;
                });
                
                // 播放攻击动画效果
                document.querySelector('.boss-avatar').style.transform = 'scale(1.1)';
                setTimeout(() => {
                    document.querySelector('.boss-avatar').style.transform = 'scale(1)';
                }, 100);
                
            } catch (error) {
                console.error('攻击失败:', error);
            }
            
            // 攻击冷却
            setTimeout(() => {
                canAttack = true;
                const bossHp = bossHpBar.style.width;
                if (bossHp !== '0%') {
                    attackBtn.disabled = false;
                }
            }, ATTACK_COOLDOWN);
        }

        async function handleBossDefeated(roomId) {
            victoryMessage.style.display = 'block';
            attackBtn.disabled = true;
            
            // 更新房间状态
            try {
                await updateDoc(doc(db, "rooms", roomId), {
                    status: 'ended'
                });
            } catch (error) {
                console.error('更新房间状态失败:', error);
            }
        }

        // ============ 房间列表监听 ============
        function listenRooms() {
            const roomsRef = collection(db, "rooms");
            const q = query(roomsRef, orderBy('createdAt', 'desc'));
            
            roomsUnsubscribe = onSnapshot(q, (snapshot) => {
                const rooms = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // 只显示未结束的房间
                    if (data.status !== 'ended') {
                        rooms.push({ 
                            id: doc.id, 
                            ...data,
                            players: data.players || []
                        });
                    }
                });
                renderRoomList(rooms);
            });
        }

        function renderRoomList(rooms) {
            if (rooms.length === 0) {
                roomList.innerHTML = '<div class="empty-state">暂无房间，创建一个吧！</div>';
                return;
            }

            roomList.innerHTML = rooms.map(room => {
                const playerCount = room.players?.length || 0;
                const statusClass = room.status === 'waiting' ? 'status-waiting' : 
                                   room.status === 'fighting' ? 'status-fighting' : 'status-ended';
                const statusText = room.status === 'waiting' ? '等待中' : 
                                  room.status === 'fighting' ? '战斗中' : '已结束';
                const hpPercent = ((room.bossHp || BOSS_MAX_HP) / BOSS_MAX_HP) * 100;
                
                return `
                    <div class="room-item">
                        <div class="room-info">
                            <h4>${room.name || '未命名房间'}</h4>
                            <p>👤 房主: ${room.hostEmail?.split('@')[0] || '未知'}</p>
                            <p>👥 玩家: ${playerCount} 人</p>
                            <p>❤️ Boss HP: ${Math.round(hpPercent)}%</p>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
                            <span class="room-status ${statusClass}">${statusText}</span>
                            <button class="btn btn-primary btn-small join-room-btn" data-room-id="${room.id}">
                                加入讨伐
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定加入按钮事件
            document.querySelectorAll('.join-room-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const roomId = e.target.dataset.roomId;
                    joinRoomById(roomId);
                });
            });
        }

        // ============ UI 切换 ============
        function showAuthUI() {
            authContainer.style.display = 'block';
            gameContainer.style.display = 'none';
        }

        function showGameUI(user) {
            currentUser = user;
            userEmailSpan.textContent = user.email;
            authContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            roomListContainer.style.display = 'block';
            battleContainer.style.display = 'none';
            
            // 开始监听房间列表
            if (roomsUnsubscribe) roomsUnsubscribe();
            listenRooms();
        }

        // ============ 初始化 ============
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showGameUI(user);
            } else {
                currentUser = null;
                showAuthUI();
                if (roomsUnsubscribe) {
                    roomsUnsubscribe();
                    roomsUnsubscribe = null;
                }
            }
        });

        // ============ 事件绑定 ============
        document.getElementById('register-btn').addEventListener('click', handleRegister);
        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('create-room-btn').addEventListener('click', createRoom);
        document.getElementById('leave-battle-btn').addEventListener('click', backToRoomList);
        document.getElementById('attack-btn').addEventListener('click', handleAttack);
        
        // 回车登录
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // 页面关闭前清理
        window.addEventListener('beforeunload', async () => {
            if (currentRoom) {
                const playerRef = ref(rtdb, `battles/${currentRoom}/players/${currentUser?.uid}`);
                await remove(playerRef);
            }
        });
    </script>
</body>
</html>
