<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星际拾荒者 - 多人在线</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#00D1FF',
            secondary: '#FF00A8',
            dark: '#0A0E17',
            light: '#E1E7F5',
            neutral: '#161B26',
          },
          fontFamily: {
            gaming: ['sans-serif']
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .game-glow { filter: drop-shadow(0 0 8px rgba(0,209,255,0.6)); }
      .player-glow { filter: drop-shadow(0 0 6px currentColor); }
      .neon-border { box-shadow: 0 0 12px rgba(0,209,255,0.4); }
    }
  </style>
</head>
<body class="bg-dark text-light font-gaming overflow-hidden">
  <div class="relative w-screen h-screen flex flex-col">
    <header class="h-16 bg-neutral/80 backdrop-blur-md border-b border-primary/30 flex items-center justify-between px-4">
      <div class="flex items-center gap-2">
        <i class="fa fa-rocket text-primary text-2xl game-glow"></i>
        <h1 class="text-xl font-bold text-primary">星际拾荒者</h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <i class="fa fa-user-circle-o text-secondary"></i>
          <span id="playerNameDisplay">-</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fa fa-star text-yellow-400"></i>
          <span id="myCoin" class="font-bold text-yellow-300">0</span>
        </div>
      </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4">
      <div class="flex-1 relative bg-neutral/60 rounded-lg neon-border overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full"></canvas>
      </div>

      <div class="w-full md:w-72 h-80 md:h-auto bg-neutral/60 rounded-lg neon-border p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-primary font-bold"><i class="fa fa-trophy text-yellow-400"></i> 排行榜</h2>
          <span id="onlineCount" class="text-xs text-secondary">在线：0</span>
        </div>
        <div id="leaderboard" class="space-y-1 overflow-y-auto h-[calc(100%-30px)]">加载中...</div>
      </div>
    </main>
  </div>

  <script>
    // 请换成你自己的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyAEr2xxxxxxxxxxxxxxxxxxxxxx",
      authDomain: "xxxx.firebaseapp.com",
      databaseURL: "https://xxxx-default-rtdb.firebaseio.com",
      projectId: "xxxx",
      storageBucket: "xxxx.appspot.com",
      messagingSenderId: "xxxxxxxx",
      appId: "1:xxxxxxx:web:xxxxxxx"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const playersRef = db.ref("players");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let myId = Math.random().toString(36).slice(2, 10);
    let myName = "玩家" + myId.slice(0,4);
    let myData = {
      x: 200,
      y: 200,
      coins: 0,
      name: myName,
      color: `hsl(${Math.random()*360},100%,65%)`,
      online: true
    };

    let players = {};
    let coins = [];
    const keys = {};

    // 画布自适应
    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);

    // 生成金币
    function genCoins() {
      coins = [];
      for(let i=0;i<40;i++) {
        coins.push({
          x: Math.random()*(canvas.width-40)+20,
          y: Math.random()*(canvas.height-40)+20
        });
      }
    }

    // 移动
    function updatePlayer() {
      const spd = 4;
      if(keys.ArrowUp||keys.w) myData.y = Math.max(15, myData.y-spd);
      if(keys.ArrowDown||keys.s) myData.y = Math.min(canvas.height-15, myData.y+spd);
      if(keys.ArrowLeft||keys.a) myData.x = Math.max(15, myData.x-spd);
      if(keys.ArrowRight||keys.d) myData.x = Math.min(canvas.width-15, myData.x+spd);

      // 吃金币
      coins.forEach((c,i)=>{
        const dx = myData.x - c.x;
        const dy = myData.y - c.y;
       if(Math.hypot(dx,dy) < 25) {
          myData.coins++;
          coins.splice(i,1);
          setTimeout(()=>{
            coins.push({
              x:Math.random()*(canvas.width-40)+20,
              y:Math.random()*(canvas.height-40)+20
            });
          },800);
        }
      });
    }

    // 渲染
    function render() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // 网格
      ctx.strokeStyle = "rgba(0,209,255,0.08)";
      for(let i=40;i<canvas.width;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke();}
      for(let i=40;i<canvas.height;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke();}
      // 金币
      coins.forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x,c.y,9,0,Math.PI*2);
        ctx.fillStyle = "#ffdf40";
        ctx.shadowColor = "#ffdf40";
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur=0;
      });
      // 玩家
      Object.values(players).forEach(p=>{
        if(!p.online) return;
        ctx.beginPath();
        ctx.arc(p.x,p.y,16,0,Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle="#fff";
        ctx.font="12px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(p.name,p.x,p.y+30);
      });
    }

    // 同步到 Firebase
    function sync() {
      playersRef.child(myId).set(myData);
      document.getElementById("myCoin").textContent = myData.coins;
      document.getElementById("playerNameDisplay").textContent = myData.name;
    }

    // 监听所有玩家
    playersRef.on("value",snap=>{
      players = snap.val()||{};
      updateBoard();
    });

    // 排行榜
    function updateBoard() {
      const list = Object.values(players).filter(p=>p.online).sort((a,b)=>b.coins-a.coins);
      document.getElementById("onlineCount").textContent = "在线："+list.length;
      const dom = document.getElementById("leaderboard");
      dom.innerHTML = "";
      list.forEach((p,i)=>{
        const div = document.createElement("div");
        div.className="flex justify-between px-2 py-1.5 rounded text-sm";
        if(p.name==myData.name) div.style.background="rgba(0,209,255,0.1)";
        div.innerHTML = `<span>#${i+1} ${p.name}</span><span class="text-yellow-300">${p.coins}</span>`;
        dom.appendChild(div);
      });
    }

    // 游戏循环
    function loop() {
      updatePlayer();
      render();
      sync();
      requestAnimationFrame(loop);
    }

    // 按键
    window.addEventListener("keydown",e=>keys[e.key]=true);
    window.addEventListener("keyup",e=>keys[e.key]=false);

    // 启动
    resize();
    genCoins();
    loop();

    // 断开时设为离线
    playersRef.child(myId).onDisconnect().update({online:false});
  </script>
</body>
</html>
