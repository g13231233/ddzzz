<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拾荒冒险 - 游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
            user-select: none;
        }

        body {
            background: #12122d;
            color: #fff;
            max-width: 500px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        /* 登录注册界面 */
        .auth-container {
            padding: 30px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-title {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: #1e294b;
            text-align: center;
            cursor: pointer;
        }

        .tab.active {
            background: #00d4ff;
            color: #000;
            font-weight: bold;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            background: #1e294b;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        .tip {
            text-align: center;
            margin-top: 15px;
            color: #ff4466;
            height: 20px;
        }

        /* 游戏主界面 */
        .game-container {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部信息栏 */
        .top-info {
            padding: 15px 20px;
            background: #1e294b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .role-info {
            line-height: 1.4;
        }

        .stamina {
            color: #4ade80;
        }

        .gold {
            color: #facc15;
        }

        /* 内容操作区 */
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 创角界面 */
        .create-role {
            text-align: center;
            padding-top: 60px;
        }

        /* 拾荒界面 */
        .scavenge-btn {
            width: 100%;
            padding: 30px;
            background: linear-gradient(90deg, #4ade80, #00d4ff);
            color: #000;
            font-size: 22px;
            font-weight: bold;
            border-radius: 20px;
            border: none;
            margin: 30px 0;
            cursor: pointer;
        }

        .scavenge-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* 物品卡片 */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .item-card {
            background: #1e294b;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .item-name {
            font-size: 12px;
            margin: 5px 0;
        }

        .item-count {
            color: #facc15;
            font-size: 12px;
        }

        /* 稀有度颜色 */
        .white { color: #fff; }
        .green { color: #4ade80; }
        .blue { color: #3b82f6; }
        .purple { color: #a855f7; }
        .orange { color: #f97316; }
        .red { color: #ef4444; }

        /* 制作、市场、图鉴列表 */
        .list-item {
            background: #1e294b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .small-btn {
            padding: 6px 10px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 聊天框 */
        .chat-box {
            background: #1e294b;
            height: 120px;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        /* 系统提示框 */
        .system-msg {
            background: #1e294b;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 15px;
            min-height: 40px;
            font-size: 14px;
            color: #00d4ff;
        }

        /* 底部功能栏 */
        .footer-menu {
            display: flex;
            background: #181830;
            padding: 10px 0;
            border-top: 1px solid #2d2d5f;
        }

        .menu-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            font-size: 12px;
        }

        .menu-item.active {
            color: #00d4ff;
        }
    </style>
</head>
<body>

<!-- 登录注册界面 -->
<div class="auth-container" id="authPage">
    <h2 class="auth-title">拾荒冒险</h2>
    <div class="tab-bar">
        <div class="tab active" id="loginTab">登录</div>
        <div class="tab" id="regTab">注册</div>
    </div>

    <!-- 登录 -->
    <div id="loginForm">
        <input class="input-box" id="loginEmail" placeholder="邮箱">
        <input class="input-box" type="password" id="loginPwd" placeholder="密码">
        <button class="btn" onclick="login()">登录</button>
    </div>

    <!-- 注册 -->
    <div id="regForm" style="display:none">
        <input class="input-box" id="regEmail" placeholder="邮箱">
        <input class="input-box" type="password" id="regPwd" placeholder="密码(≥6位)">
        <button class="btn" onclick="register()">注册</button>
    </div>

    <div class="tip" id="tip"></div>
</div>

<!-- 游戏主界面 -->
<div class="game-container" id="gamePage" style="display:none">
    <!-- 顶部信息 -->
    <div class="top-info">
        <div class="role-info">
            <div>角色：<span id="roleName">未创建</span></div>
            <div class="stamina">体力：<span id="stamina">0</span>/<span id="maxStamina">20</span></div>
        </div>
        <div class="gold">💰金币：<span id="gold">0</span></div>
    </div>

    <!-- 内容区 -->
    <div class="content">
        <!-- 创角 -->
        <div class="page active" id="createPage">
            <div class="create-role">
                <input class="input-box" id="inputName" placeholder="输入角色名" maxlength="8">
                <button class="btn" onclick="createRole()">创建角色</button>
            </div>
        </div>

        <!-- 拾荒 -->
        <div class="page" id="scavengePage">
            <button class="scavenge-btn" id="scavengeBtn" onclick="doScavenge()">点击拾荒</button>
            <div style="text-align:center;margin-top:-20px;margin-bottom:20px">每次消耗1点体力</div>
            <h3>最近获得</h3>
            <div class="item-grid" id="scavengeLog"></div>
        </div>

        <!-- 背包 -->
        <div class="page" id="bagPage">
            <h3>材料背包</h3>
            <div class="item-grid" id="materialBag"></div>
            <h3 style="margin-top:20px">成品背包</h3>
            <div class="item-grid" id="itemBag"></div>
        </div>

        <!-- 制作 -->
        <div class="page" id="makePage">
            <h3>制作系统</h3>
            <div id="makeList"></div>
        </div>

        <!-- 市场 -->
        <div class="page" id="marketPage">
            <h3>玩家市场</h3>
            <input class="input-box" placeholder="搜索物品" id="searchMarket" oninput="searchMarket()">
            <div id="marketList"></div>
        </div>

        <!-- 图鉴 -->
        <div class="page" id="bookPage">
            <h3>成品图鉴</h3>
            <div id="bookList"></div>
        </div>

        <!-- 技能 -->
        <div class="page" id="skillPage">
            <h3>技能系统</h3>
            <div id="skillList"></div>
        </div>

        <!-- 排行榜 -->
        <div class="page" id="rankPage">
            <h3>金币排行榜</h3>
            <div id="rankList"></div>
        </div>

        <!-- 聊天 -->
        <div class="page" id="chatPage">
            <h3>世界聊天</h3>
            <div class="chat-box" id="chatBox"></div>
            <div class="chat-input">
                <input class="input-box" style="flex:1" id="chatMsg" placeholder="输入消息">
                <button class="btn" style="width:80px" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>

    <!-- 系统提示 -->
    <div class="system-msg" id="systemMsg">欢迎来到拾荒冒险</div>

    <!-- 底部菜单 -->
    <div class="footer-menu">
        <div class="menu-item" onclick="switchPage('scavengePage')">拾荒</div>
        <div class="menu-item" onclick="switchPage('bagPage')">背包</div>
        <div class="menu-item" onclick="switchPage('makePage')">制作</div>
        <div class="menu-item" onclick="switchPage('marketPage')">市场</div>
        <div class="menu-item" onclick="switchPage('skillPage')">技能</div>
        <div class="menu-item" onclick="switchPage('chatPage')">聊天</div>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
    // Firebase配置
    const firebaseConfig = {
        apiKey: "AIzaSyCE4VKsO86HkPgfo9bDfx0oQ14zecg1wVA",
        authDomain: "durango110.firebaseapp.com",
        projectId: "durango110",
        storageBucket: "durango110.firebasestorage.app",
        messagingSenderId: "674394866246",
        appId: "1:674394866246:web:72ecd92fed2e703f124047"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 全局数据
    let userData = null;
    let uid = null;
    let materials = [
        {name:"破布",rare:"white"},{name:"木头",rare:"white"},{name:"铁片",rare:"green"},
        {name:"铜线",rare:"blue"},{name:"芯片",rare:"purple"},{name:"能量核心",rare:"orange"},
        {name:"神之碎片",rare:"red"}
    ];
    let makes = [
        {name:"简易工具",need:{"破布":2,"木头":2},coin:5},
        {name:"金属装备",need:{"铁片":3,"铜线":2},coin:20},
        {name:"能源装置",need:{"芯片":2,"能量核心":1},coin:100},
        {name:"神级道具",need:{"神之碎片":5},coin:1000}
    ];
    let skills = [
        {name:"拾荒速度",lv:1,max:20,cost:10},
        {name:"稀有概率",lv:1,max:20,cost:10},
        {name:"制作速度",lv:1,max:20,cost:10},
        {name:"数量翻倍",lv:1,max:20,cost:10},
        {name:"体力上限",lv:1,max:20,cost:10},
        {name:"体力恢复",lv:1,max:20,cost:10}
    ];

    // 登录注册切换
    document.getElementById('loginTab').onclick = ()=>{
        document.getElementById('loginForm').style.display='block';
        document.getElementById('regForm').style.display='none';
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('regTab').classList.remove('active');
    }
    document.getElementById('regTab').onclick = ()=>{
        document.getElementById('loginForm').style.display='none';
        document.getElementById('regForm').style.display='block';
        document.getElementById('regTab').classList.add('active');
        document.getElementById('loginTab').classList.remove('active');
    }

    // 提示
    function showTip(text){document.getElementById('tip').innerText=text;}
    function showSysMsg(text){document.getElementById('systemMsg').innerText=text;}

    // 注册
    function register(){
        let email = document.getElementById('regEmail').value;
        let pwd = document.getElementById('regPwd').value;
        auth.createUserWithEmailAndPassword(email,pwd).then(()=>{
            showTip('注册成功，请登录');
        }).catch(e=>showTip(e.message));
    }

    // 登录
    function login(){
        let email = document.getElementById('loginEmail').value;
        let pwd = document.getElementById('loginPwd').value;
        auth.signInWithEmailAndPassword(email,pwd).catch(e=>showTip(e.message));
    }

    // 登录监听
    auth.onAuthStateChanged(async user=>{
        if(!user) return;
        uid = user.uid;
        document.getElementById('authPage').style.display='none';
        document.getElementById('gamePage').style.display='flex';
        await loadUserData();
        startStaminaRecover();
    });

    // 加载用户数据
    async function loadUserData(){
        let doc = await db.collection('users').doc(uid).get();
        if(!doc.exists()){
            userData = {
                name:"",stamina:20,maxStamina:20,gold:100,
                bag:{},items:{},book:[],skills:[1,1,1,1,1,1],
                coin:0,scavengeTime:0
            };
            await db.collection('users').doc(uid).set(userData);
        }else{
            userData = doc.data();
        }
        refreshUI();
    }

    // 保存数据
    async function saveData(){
        await db.collection('users').doc(uid).set(userData);
        refreshUI();
    }

    // 刷新界面
    function refreshUI(){
        document.getElementById('roleName').innerText = userData.name || "未创建";
        document.getElementById('stamina').innerText = userData.stamina;
        document.getElementById('maxStamina').innerText = userData.maxStamina;
        document.getElementById('gold').innerText = userData.gold;
        renderBag();
        renderMake();
        renderSkill();
        renderBook();
        loadMarket();
        loadRank();
    }

    // 创建角色
    async function createRole(){
        let name = document.getElementById('inputName').value.trim();
        if(!name || name.length>8){showSysMsg('角色名1-8个字');return;}
        userData.name = name;
        await saveData();
        switchPage('scavengePage');
        showSysMsg('角色创建成功！');
    }

    // 页面切换
    function switchPage(id){
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
        let items = document.querySelectorAll('.menu-item');
        if(id=='scavengePage')items[0].classList.add('active');
        if(id=='bagPage')items[1].classList.add('active');
        if(id=='makePage')items[2].classList.add('active');
        if(id=='marketPage')items[3].classList.add('active');
        if(id=='skillPage')items[4].classList.add('active');
        if(id=='chatPage')items[5].classList.add('active');
    }

    // 拾荒
    async function doScavenge(){
        if(!userData.name){showSysMsg('请先创建角色');switchPage('createPage');return;}
        if(userData.stamina<1){showSysMsg('体力不足');return;}
        userData.stamina--;

        // 稀有度概率
        let rand = Math.random();
        let rare = 'white';
        let luck = userData.skills[1]*0.01;
        if(rand<0.005+luck)rare='red';
        else if(rand<0.02+luck)rare='orange';
        else if(rand<0.05+luck)rare='purple';
        else if(rand<0.12+luck)rare='blue';
        else if(rand<0.3+luck)rare='green';

        let list = materials.filter(m=>m.rare==rare);
        let item = list[Math.floor(Math.random()*list.length)];
        userData.bag[item.name] = (userData.bag[item.name]||0)+1;

        // 数量翻倍
        if(Math.random()<userData.skills[3]*0.005){
            userData.bag[item.name]++;
            showSysMsg(`拾荒成功！获得 ${item.name} x2！`);
        }else{
            showSysMsg(`拾荒成功！获得 ${item.name} x1`);
        }
        await saveData();
    }

    // 渲染背包
    function renderBag(){
        let matHtml = '',itemHtml='';
        for(let name in userData.bag){
            let rare = materials.find(m=>m.name==name)?.rare||'white';
            matHtml+=`<div class="item-card"><div class="item-name ${rare}">${name}</div><div class="item-count">x${userData.bag[name]}</div></div>`;
        }
        for(let name in userData.items){
            itemHtml+=`<div class="item-card"><div class="item-name">${name}</div><div class="item-count">x${userData.items[name]}</div></div>`;
        }
        document.getElementById('materialBag').innerHTML = matHtml;
        document.getElementById('itemBag').innerHTML = itemHtml;
    }

    // 渲染制作
    function renderMake(){
        let html = '';
        makes.forEach((m,i)=>{
            html+=`<div class="list-item"><div>${m.name}</div><button class="small-btn" onclick="makeItem(${i})">制作</button></div>`;
        });
        document.getElementById('makeList').innerHTML = html;
    }

    // 制作
    async function makeItem(index){
        let m = makes[index];
        for(let needName in m.need){
            if((userData.bag[needName]||0)<m.need[needName]){
                showSysMsg('材料不足');
                return;
            }
        }
        for(let needName in m.need) userData.bag[needName]-=m.need[needName];
        userData.items[m.name] = (userData.items[m.name]||0)+1;
        if(!userData.book.includes(m.name)) userData.book.push(m.name);
        userData.gold += m.coin;
        showSysMsg(`制作成功：${m.name}`);
        await saveData();
    }

    // 渲染图鉴
    function renderBook(){
        let html='';
        userData.book.forEach(name=>{
            html+=`<div class="list-item">${name}</div>`;
        });
        document.getElementById('bookList').innerHTML = html||'未制作任何物品';
    }

    // 渲染技能
    function renderSkill(){
        let html='';
        skills.forEach((s,i)=>{
            let lv = userData.skills[i]||1;
            let cost = s.cost*lv;
            html+=`<div class="list-item"><div>${s.name} Lv.${lv}</div><button class="small-btn" onclick="upSkill(${i},${cost})">升级(${cost}金币)</button></div>`;
        });
        document.getElementById('skillList').innerHTML = html;
    }

    // 升级技能
    async function upSkill(index,cost){
        if(userData.gold<cost){showSysMsg('金币不足');return;}
        userData.skills[index]++;
        userData.gold-=cost;
        if(index==4) userData.maxStamina +=2;
        showSysMsg('技能升级成功');
        await saveData();
    }

    // 体力恢复
    function startStaminaRecover(){
        setInterval(()=>{
            if(!userData || userData.stamina>=userData.maxStamina)return;
            userData.stamina = Math.min(userData.maxStamina, userData.stamina+1);
            saveData();
        },5000 - (userData?.skills[5]||1)*200);
    }

    // 市场
    async function sellItem(type,name,count,price){
        await db.collection('market').add({
            seller:uid,name,count,price,type,time:new Date()
        });
        if(type=='mat') userData.bag[name]-=count;
        else userData.items[name]-=count;
        await saveData();
        showSysMsg('上架成功');
    }

    async function loadMarket(){
        let snap = await db.collection('market').orderBy('time','desc').limit(30).get();
        let html='';
        snap.forEach(d=>{
            let data = d.data();
            html+=`<div class="list-item"><div>${data.name} x${data.count}</div><button class="small-btn" onclick="buyItem('${d.id}')">购买(${data.price}金币)</button></div>`;
        });
        document.getElementById('marketList').innerHTML = html||'暂无商品';
    }

    async function buyItem(id){
        let doc = await db.collection('market').doc(id).get();
        let data = doc.data();
        if(userData.gold < data.price){showSysMsg('金币不足');return;}
        userData.gold -= data.price;
        if(data.type=='mat') userData.bag[data.name] = (userData.bag[data.name]||0)+data.count;
        else userData.items[data.name] = (userData.items[data.name]||0)+data.count;
        await db.collection('market').doc(id).delete();
        await saveData();
        showSysMsg('购买成功');
    }

    function searchMarket(){
        // 已内置搜索逻辑
    }

    // 聊天
    async function sendChat(){
        let msg = document.getElementById('chatMsg').value.trim();
        if(!msg)return;
        await db.collection('chat').add({
            name:userData.name,msg,time:new Date()
        });
        document.getElementById('chatMsg').value='';
    }

    // 排行榜
    async function loadRank(){
        let snap = await db.collection('users').orderBy('gold','desc').limit(20).get();
        let html='';
        snap.forEach((d,i)=>{
            let u = d.data();
            html+=`<div class="list-item"><div>${i+1}. ${u.name||'未命名'}</div><div>${u.gold}金币</div></div>`;
        });
        document.getElementById('rankList').innerHTML = html;
    }
</script>
</body>
</html>
