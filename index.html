<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联机测试</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px;max-width:400px;margin:auto}
.online{color:#0f0;margin:10px 0;font-size:16px}
.chat{background:#222;height:250px;padding:10px;overflow-y:auto;border-radius:6px;margin:10px 0}
input,button{padding:10px;width:100%;margin:5px 0;border-radius:6px;border:none}
button{background:#09f;color:#fff}
</style>
</head>
<body>

<div class="online" id="online">在线人数：加载中...</div>
<button id="testBtn">测试按钮（可点）</button>
<div class="chat" id="chat"></div>
<input id="msg" placeholder="输入聊天内容">
<button id="send">发送聊天</button>

<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js"></script>
<script>
// 极简配置，无报错
const firebaseConfig = {
  apiKey: "AIzaSyC4RvmbE9HkZJz7IVDdQjLqVq1nHkVG9dQ",
  databaseURL: "https://public-xianxiu-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 在线状态
const uid = localStorage.getItem("uid") || Math.random().toString(36).substr(2,8);
localStorage.setItem("uid", uid);
const online = db.ref("online_test").child(uid);
online.set(true);
online.onDisconnect().remove();

// 在线人数
db.ref("online_test").on("value", snap => {
  document.getElementById("online").innerText = "在线人数：" + snap.size + " 人";
});

// 聊天
const chatRef = db.ref("chat_test");

// 发送
document.getElementById("send").onclick = () => {
  const txt = document.getElementById("msg").value.trim();
  if(txt){
    chatRef.push({name:"玩家",msg:txt});
    document.getElementById("msg").value = "";
  }
};

// 接收
chatRef.limitToLast(20).on("child_added", s => {
  const d = s.val();
  const c = document.getElementById("chat");
  c.innerHTML += d.name + "：" + d.msg + "<br>";
  c.scrollTop = c.scrollHeight;
});

// 测试按钮
document.getElementById("testBtn").onclick = ()=>{
  alert("按钮正常可点击");
};
</script>
</body>
</html>
