<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>金牌牌之战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-top: env(safe-area-inset-top, 0px);
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.1);
            padding-top: constant(safe-area-inset-top);
            padding-top: env(safe-area-inset-top);
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            padding-bottom: calc(100px + env(safe-area-inset-bottom, 20px));
            /* 关键修复：允许内容区域滚动 */
            overflow: hidden;
        }

        /* 抽卡页面样式 */
        .draw-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .card-display {
            width: 280px;
            height: 380px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 30px;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            max-width: 90vw;
            max-height: 50vh;
        }

        .card-display.show {
            transform: scale(1);
            opacity: 1;
        }

        .card-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }

        .card-display.show::before {
            animation: shine 0.5s ease-in-out;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0; }
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-description {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .card-icon {
            font-size: 50px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .draw-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .draw-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .draw-button:active {
            transform: translateY(0);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        /* 图鉴页面样式 - 修复滚动问题 */
        .collection-page {
            display: none;
            width: 100%;
            height: 100%;
            /* 关键修复：使用自动滚动 */
            overflow-y: auto;
            padding: 20px;
            /* 关键修复：确保内容可以滚动到底部 */
            padding-bottom: 40px;
        }

        .collection-page.active {
            display: block;
        }

        .collection-header-text {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            /* 修复：添加相对定位确保不被遮挡 */
            position: relative;
            z-index: 1;
        }

        .collection-header-text h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .collection-header-text p {
            font-size: 14px;
            opacity: 0.8;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            /* 修复：确保底部有足够空间 */
            padding-bottom: 60px;
        }

        .collection-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* 修复：确保卡片内容不会溢出 */
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .collection-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.15);
        }

        .collection-card-icon {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .collection-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .collection-card p {
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.4;
        }

        /* 排行榜页面样式 */
        .leaderboard-page {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }

        .leaderboard-page.active {
            display: block;
        }

        .leaderboard-header {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .leaderboard-header h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .leaderboard-header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .leaderboard-list {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .leaderboard-item:last-child {
            margin-bottom: 0;
        }

        .leaderboard-rank {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .leaderboard-rank.gold {
            color: #FFD700;
        }

        .leaderboard-rank.silver {
            color: #C0C0C0;
        }

        .leaderboard-rank.bronze {
            color: #CD7F32;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .leaderboard-score {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 20px));
            height: calc(70px + env(safe-area-inset-bottom, 20px));
        }

        .nav-item {
            flex: 1;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 10px;
            transition: all 0.3s ease;
            border-radius: 10px;
            margin: 0 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-text {
            font-size: 11px;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 针对小屏幕设备的优化 */
        @media (max-height: 700px) {
            .card-display {
                width: 250px;
                height: 320px;
            }
            
            .card-title {
                font-size: 20px;
            }
            
            .card-description {
                font-size: 13px;
            }
            
            .card-icon {
                font-size: 40px;
            }
            
            .collection-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 10px;
            }
            
            .collection-card {
                padding: 15px;
            }
            
            .collection-card-icon {
                font-size: 30px;
            }
            
            .collection-card h3 {
                font-size: 16px;
            }
            
            .collection-card p {
                font-size: 12px;
            }
        }

        /* 针对iPhone X及更新机型的特殊适配 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-nav {
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>金牌牌之战</h1>
            <p>为每局游戏添加特殊效果</p>
        </div>

        <div class="main-content">
            <!-- 抽卡页面 -->
            <div class="draw-page" id="drawPage">
                <div class="card-display" id="cardDisplay">
                    <div class="card-icon">🎴</div>
                    <div class="card-title">点击启动</div>
                    <div class="card-description">开始你的金牌牌之战</div>
                </div>
                <button class="draw-button" id="drawButton">启动</button>
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                </div>
            </div>

            <!-- 图鉴页面 -->
            <div class="collection-page" id="collectionPage">
                <div class="collection-header-text">
                    <h2>图鉴</h2>
                    <p>查看所有可用的效果</p>
                </div>
                <div class="collection-grid" id="collectionGrid">
                    <!-- 卡片将通过JavaScript动态生成 -->
                </div>
            </div>

            <!-- 排行榜页面 -->
            <div class="leaderboard-page" id="leaderboardPage">
                <div class="leaderboard-header">
                    <h2>排行榜</h2>
                    <p>玩家积分榜</p>
                </div>
                <div class="leaderboard-list" id="leaderboardList">
                    <!-- 排行榜数据将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" id="drawNav">
                <div class="nav-icon">🎲</div>
                <div class="nav-text">抽卡</div>
            </div>
            <div class="nav-item" id="collectionNav">
                <div class="nav-icon">📚</div>
                <div class="nav-text">图鉴</div>
            </div>
            <div class="nav-item" id="leaderboardNav">
                <div class="nav-icon">🏆</div>
                <div class="nav-text">排行</div>
            </div>
        </div>
    </div>

    <script>
        // 城邦卡片数据
        const cards = [
            {
                id: 1,
                name: "黄金之城",
                icon: "💰",
                description: "所有玩家积分奖励翻倍",
                color: "linear-gradient(135deg, #f6d365 0%, #fda085 100%)"
            },
            {
                id: 2,
                name: "公平交易",
                icon: "🔮",
                description: "所有玩家都可以和下家交换一张牌",
                color: "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)"
            },
            {
                id: 3,
                name: "暗夜之光",
                icon: "🌙",
                description: "所有玩家全部明牌打",
                color: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)"
            },
            {
                id: 4,
                name: "时间神殿",
                icon: "⏰",
                description: "本局游戏限时3分钟，3分钟后谁的牌最少谁赢",
                color: "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)"
            },
            {
                id: 5,
                name: "幸运广场",
                icon: "🍀",
                description: "所有玩家可在已出牌库中随机摸一张牌",
                color: "linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%)"
            },
            {
                id: 6,
                name: "我要验牌",
                icon: "🧠",
                description: "所有玩家在任何时候都可以选择看一次上家或下家的牌，二选一",
                color: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
            },
            {
                id: 7,
                name: "给我擦皮鞋",
                icon: "⚔️",
                description: "最后一名输家给第一名赢家擦皮鞋，不想擦可以支付5积分",
                color: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
            },
            {
                id: 8,
                name: "核平花园",
                icon: "🌸",
                description: "每使用一次炸弹都可以任意丢弃一张牌",
                color: "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)"
            },
            {
                id: 9,
                name: "小憋三",
                icon: "🎯",
                description: "每出一张3增加5积分",
                color: "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)"
            },
            {
                id: 10,
                name: "牌没有问题",
                icon: "🗿",
                description: "上一局的输家可以在每个人的手牌中随机摸一张牌",
                color: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)"
            }
        ];

        // 模拟排行榜数据
        const mockLeaderboardData = [
            { name: "扑克大师", score: 2580, date: "2024-01-07" },
            { name: "卡牌王者", score: 2340, date: "2024-01-06" },
            { name: "策略高手", score: 2120, date: "2024-01-05" },
            { name: "运气之王", score: 1980, date: "2024-01-04" },
            { name: "智慧之星", score: 1850, date: "2024-01-03" },
            { name: "勇者无畏", score: 1720, date: "2024-01-02" },
            { name: "神秘玩家", score: 1680, date: "2024-01-01" },
            { name: "和平使者", score: 1550, date: "2023-12-31" }
        ];

        let currentCard = null;
        let isAnimating = false;

        // DOM元素
        const drawPage = document.getElementById('drawPage');
        const collectionPage = document.getElementById('collectionPage');
        const leaderboardPage = document.getElementById('leaderboardPage');
        const cardDisplay = document.getElementById('cardDisplay');
        const drawButton = document.getElementById('drawButton');
        const drawNav = document.getElementById('drawNav');
        const collectionNav = document.getElementById('collectionNav');
        const leaderboardNav = document.getElementById('leaderboardNav');
        const collectionGrid = document.getElementById('collectionGrid');
        const loading = document.getElementById('loading');
        const leaderboardList = document.getElementById('leaderboardList');

        // 页面切换功能
        function showPage(pageName) {
            // 隐藏所有页面
            drawPage.style.display = 'none';
            collectionPage.style.display = 'none';
            leaderboardPage.style.display = 'none';
            
            // 移除所有导航项的激活状态
            drawNav.classList.remove('active');
            collectionNav.classList.remove('active');
            leaderboardNav.classList.remove('active');
            
            // 显示指定页面并激活对应导航
            switch(pageName) {
                case 'draw':
                    drawPage.style.display = 'flex';
                    drawNav.classList.add('active');
                    break;
                case 'collection':
                    collectionPage.style.display = 'block';
                    collectionPage.classList.add('active');
                    collectionNav.classList.add('active');
                    break;
                case 'leaderboard':
                    leaderboardPage.style.display = 'block';
                    leaderboardPage.classList.add('active');
                    leaderboardNav.classList.add('active');
                    break;
            }
        }

        // 抽卡功能
        function drawCard() {
            if (isAnimating) return;
            
            isAnimating = true;
            drawButton.disabled = true;
            loading.style.display = 'block';
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * cards.length);
                currentCard = cards[randomIndex];
                
                cardDisplay.style.background = currentCard.color;
                cardDisplay.innerHTML = `
                    <div class="card-icon">${currentCard.icon}</div>
                    <div class="card-title">${currentCard.name}</div>
                    <div class="card-description">${currentCard.description}</div>
                `;
                
                loading.style.display = 'none';
                cardDisplay.classList.add('show');
                
                setTimeout(() => {
                    isAnimating = false;
                    drawButton.disabled = false;
                }, 500);
            }, 1000);
        }

        // 初始化图鉴
        function initCollection() {
            collectionGrid.innerHTML = '';
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'collection-card';
                cardElement.innerHTML = `
                    <div class="collection-card-icon">${card.icon}</div>
                    <h3>${card.name}</h3>
                    <p>${card.description}</p>
                `;
                collectionGrid.appendChild(cardElement);
            });
        }

        // 初始化排行榜
        function initLeaderboard() {
            leaderboardList.innerHTML = '';
            mockLeaderboardData.forEach((item, index) => {
                const itemElement = document.createElement('div');
                itemElement.className = 'leaderboard-item';
                
                let rankClass = '';
                if (index === 0) rankClass = 'gold';
                else if (index === 1) rankClass = 'silver';
                else if (index === 2) rankClass = 'bronze';
                
                itemElement.innerHTML = `
                    <div class="leaderboard-rank ${rankClass}">${index + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${item.name}</div>
                        <div class="leaderboard-score">${item.score} 分 • ${item.date}</div>
                    </div>
                `;
                
                leaderboardList.appendChild(itemElement);
            });
        }

        // 事件监听
        drawButton.addEventListener('click', drawCard);
        drawNav.addEventListener('click', () => showPage('draw'));
        collectionNav.addEventListener('click', () => showPage('collection'));
        leaderboardNav.addEventListener('click', () => showPage('leaderboard'));

        // 初始化
        cardDisplay.classList.add('show');
        initCollection();
        initLeaderboard();
    </script>
</body>
</html>
